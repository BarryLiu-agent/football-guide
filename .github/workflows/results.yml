name: Results Refresh (30min)

on:
  schedule:
    # 每 30 分钟：只刷新赛程/赛果 + 消息 + 预测结算(仅统计模型) + 部署
    # 不抓赔率（The Odds API 配额限制，赔率由 daily.yml 每天更新）
    - cron: '*/30 * * * *'
    # 每 4 小时一次：额外调用 AI 研判（省 AI 额度）
    - cron: '15 2,6,10,14,18,22 * * *'
  workflow_dispatch:

# 与 daily.yml 共享同一并发组：防止 30min 定时与 push 触发同时跑,
# 并发改写 data/fixtures.json、predictions.json 等共享文件导致状态不一致。
concurrency:
  group: data-pipeline
  cancel-in-progress: true

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch fixtures & results
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/fetch_data.py --no-standings

      - name: Fetch messages
        run: python scripts/messages_fetcher.py

      - name: "Run prediction engine (30min 高频: 仅统计模型，省 AI 额度)"
        if: github.event.schedule == '*/30 * * * *'
        run: python scripts/predict.py --skip-ai

      - name: "Run prediction engine (每4小时/手动: 含 AI 研判)"
        if: github.event.schedule != '*/30 * * * *'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python scripts/predict.py

      - name: "Prediction consistency check (方向 vs 概率最大值)"
        run: python scripts/check_consistency.py

      - name: Build status manifest (data/status.json)
        run: python scripts/build_status.py

      - name: Build version fingerprint (data/version.json)
        run: python scripts/build_version.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: false
          destination_dir: ''
