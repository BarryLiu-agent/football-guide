name: Lineups Fetch (hourly)

on:
  schedule:
    # 每小时 15 分（UTC）：五大联赛比赛多在北京时间 18:00-04:00 开球，
    # 首发名单在开赛前 60~75 分钟公布 → 每小时抓一次覆盖所有开球时段。
    # 脚本只抓"未来 3 小时内开赛"的比赛，其余自动跳过。
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  fetch-lineups:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch lineups (多源回退: FotMob → ESPN → Sofascore)
        run: python scripts/lineup_fetcher.py

      - name: Commit lineups data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineups.json
          if git diff --cached --quiet; then
            echo "无首发更新"
          else
            git commit -m "chore: 更新赛前首发数据 [skip ci]"
            git push
          fi
