name: Lineups Fetch (hourly)

on:
  schedule:
    # 每小时 15 分（UTC）：首发名单在开球前 60~75 分钟公布，
    # 每小时粒度即可保证公布后 1 小时内被抓到；脚本只抓"未来 3 小时开赛"场次。
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  fetch-lineups:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: "Fetch lineups (多源回退: FotMob → ESPN → Sofascore)"
        run: python scripts/lineup_fetcher.py

      - name: Commit lineups data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineups.json
          if git diff --cached --quiet; then
            echo "无首发更新"
          else
            git commit -m "chore: 更新赛前首发数据 [skip ci]"
            # 本地竞彩脚本每小时也会 push → 必须 rebase 防冲突，失败重试 3 次
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin main; then
                echo "首发数据已写回 main"
                break
              fi
              echo "写回失败，重试 $i/3"
              sleep 5
            done
          fi
