name: Lineups Fetch (every 15 min)

on:
  schedule:
    # 每 15 分钟一次（UTC）：首发名单在开球前 60~75 分钟公布，
    # 15 分钟粒度保证公布后 15 分钟内被抓到；脚本只抓"未来 3 小时开赛"场次，请求可控。
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-lineups:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch lineups (多源回退: FotMob → ESPN → Sofascore)
        run: python scripts/lineup_fetcher.py

      - name: Commit lineups data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineups.json
          if git diff --cached --quiet; then
            echo "无首发更新"
          else
            git commit -m "chore: 更新赛前首发数据 [skip ci]"
            git push
          fi
