name: Daily Data Fetch & Deploy

on:
  schedule:
    # 每天一次 UTC 02:00（北京 10:00）→ 赔率走势曲线每天累积 1 个采样点。
    # The Odds API 免费配额 500/月：5 联赛 × 3 markets = 15/天 ≈ 450/月（CL 休赛期不抓）
    - cron: '0 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发（消耗配额，注意剩余量）

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch fixtures
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
        run: python scripts/odds_fetcher.py --leagues PL PD SA BL1 FL1

      - name: Fetch Asian handicap (football-data.co.uk)
        run: python scripts/asian_fetch.py 2526

      - name: Fetch messages
        run: python scripts/messages_fetcher.py

      - name: Run prediction engine
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python scripts/predict.py

      - name: Model calibration backtest
        run: python scripts/backtest.py

      - name: Odds calibration backtest (OU/Asian)
        run: python scripts/backtest_ou.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: false
          destination_dir: ''
