name: Daily Data Fetch & Deploy

on:
  schedule:
    # 每 30 分钟（北京时间 08:30 起），保证刷新分析后有新数据
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch fixtures
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_fetcher.py

      - name: Fetch messages
        run: python scripts/messages_fetcher.py

      - name: Run prediction engine
        run: python scripts/predict.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: false
          destination_dir: ''
