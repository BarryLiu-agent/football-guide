name: Daily Data Fetch & Deploy

on:
  schedule:
    # 每天一次 UTC 02:00（北京 10:00）→ 赔率走势曲线每天累积 1 个采样点。
    # The Odds API 免费配额 500/月：6 联赛 × 3 markets = 18/天 ≈ 540/月。
    # 若配额紧张，可在欧冠休赛期临时去掉 CL；默认按“五大联赛+欧冠”目标范围抓取。
    - cron: '0 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发（消耗配额，注意剩余量）

# 与 results.yml 共享同一并发组：防止 push 触发与 30min 定时同时跑,
# 并发改写 data/fixtures.json、predictions.json 等共享文件导致状态不一致。
concurrency:
  group: data-pipeline
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch fixtures
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Fetch odds (仅定时/手动，push 不抓以省配额)
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
        run: python scripts/odds_fetcher.py --leagues PL PD SA BL1 FL1 CL

      - name: Fetch messages
        run: python scripts/messages_fetcher.py

      - name: "Run prediction engine (push: 仅统计模型，省 AI 额度)"
        if: github.event_name == 'push'
        run: python scripts/predict.py --skip-ai

      - name: "Run prediction engine (定时/手动: 含 AI 研判)"
        if: github.event_name != 'push'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python scripts/predict.py

      - name: Model calibration backtest
        run: python scripts/backtest.py

      - name: "Prediction consistency check (方向 vs 概率最大值)"
        run: python scripts/check_consistency.py

      - name: Odds calibration backtest (OU/Asian)
        run: python scripts/backtest_ou.py

      - name: Model evolution (weekly self-calibration)
        run: python scripts/evolve.py --apply

      - name: Build status manifest (data/status.json)
        run: python scripts/build_status.py

      - name: Build version fingerprint (data/version.json)
        run: python scripts/build_version.py

      - name: Commit refreshed data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # 部署条件 = 数据有变化 OR 本次 push 提交改动了非数据文件(index.html/config/脚本等)。
          # 代码改动(如 index.html)无需数据变化也需重新部署上线。
          code_changed=0
          if git diff --quiet "$(git rev-parse HEAD^ 2>/dev/null || echo HEAD~1)" HEAD -- ':!data' ':!**/*.json'; then
            code_changed=0
          else
            code_changed=1
          fi
          if git diff --cached --quiet && [ "$code_changed" = "0" ]; then
            echo "无影响部署的改动，跳过提交"
            echo "data_changed=false" >> "$GITHUB_ENV"
          else
            if ! git diff --cached --quiet; then
              git commit -m "chore: CI 更新数据 [skip ci]"
            fi
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin main; then
                echo "已写回 main"
                break
              fi
              echo "写回失败，重试 $i/3"
              sleep 5
            done
            echo "data_changed=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy to GitHub Pages
        # 无影响部署的改动则跳过部署，省 Actions 分钟数
        if: env.data_changed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: false
          destination_dir: ''
