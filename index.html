<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="五大联赛+欧冠实时比分、欧赔/亚盘、模型预测与 AI 研判 - 个人数据分析工具站">
<meta property="og:title" content="足球数据面板">
<meta property="og:description" content="五大联赛+欧冠赔率与模型预测数据分析">
<meta property="og:type" content="website">
<link rel="canonical" href="https://barryliu-agent.github.io/football-guide/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<title>足球数据面板 - 五大联赛+欧冠赔率与模型预测</title>
<style>
/* 焦点可见性（键盘导航） */
:focus-visible { outline: 2px solid var(--gold, #f0b90b); outline-offset: 2px; }

/* ===== Design Tokens ===== */
:root {
  --bg: #0b0e14;
  --bg-2: #11151d;
  --surface: #171c26;
  --surface-2: #1d2330;
  --border: #262d3b;
  --border-light: #333c4d;
  --text: #e8ecf2;
  --text-2: #9aa5b5;
  --text-3: #8b95a3;  /* 对比度达标(在 #0b0e14 上 ≈5.2:1) */
  --muted: #8b95a3;
  --gold: #f0b90b;
  --gold-dim: #b8860b;
  --green: #16c784;
  --green-bg: rgba(22, 199, 132, 0.12);
  --red: #ea3943;
  --red-bg: rgba(234, 57, 67, 0.12);
  --blue: #3b82f6;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-color: var(--border-light) var(--bg); }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { display: block; }

/* ===== Header ===== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11, 14, 20, 0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1200px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 16px;
}
.logo { font-size: 17px; font-weight: 800; letter-spacing: 0.02em; }
.logo .accent { color: var(--gold); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.header-time { font-size: 11px; color: var(--text-3); }
.btn-refresh {
  font-size: 12px; padding: 6px 12px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); transition: all .15s;
}
.btn-refresh:hover { border-color: var(--gold); color: var(--gold); }
.btn-refresh:active { transform: scale(0.96); }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ===== League Nav ===== */
.league-nav {
  display: flex; gap: 8px; overflow-x: auto;
  max-width: 1200px; margin: 0 auto; padding: 12px 20px 0;
}
.league-nav::-webkit-scrollbar { height: 0; }
.lg-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px 10px 0 0;
  background: var(--bg-2); border: 1px solid var(--border); border-bottom: none;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: all .15s; white-space: nowrap;
}
.lg-btn .lg-badge {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; color: #fff;
}
.lg-btn:hover { color: var(--text); background: var(--surface); }
.lg-btn.active { background: var(--surface); color: var(--text); border-color: var(--border-light); }
.lg-btn.active .lg-badge { box-shadow: 0 0 0 2px var(--gold-dim); }
/* 全局功能入口(串关/战绩):与联赛平级,金色描边区分 */
.lg-btn.global {
  border: 1px solid rgba(240,185,11,.35);
  border-bottom: none;
  color: var(--gold);
}
.lg-btn.global.active {
  background: rgba(240,185,11,.1);
  color: var(--gold);
  border-color: rgba(240,185,11,.6);
}

/* ===== Sub Nav (4 sections) ===== */
.sub-nav {
  display: flex; gap: 4px; max-width: 1200px; margin: 0 auto; padding: 0 20px;
  border-bottom: 1px solid var(--border);
}
.sub-btn {
  padding: 8px 14px; font-size: 12.5px; font-weight: 500; color: var(--text-3);
  border-bottom: 2px solid transparent; transition: all .15s;
}
.sub-btn:hover { color: var(--text); }
.sub-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ===== Main ===== */
.main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 60px; }

/* ===== Match Card ===== */
.match-list { display: flex; flex-direction: column; gap: 8px; }
.match-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; gap: 14px;
  transition: all .15s; cursor: pointer;
}
.match-card:hover { border-color: var(--border-light); transform: translateY(-1px); box-shadow: var(--shadow); }
.mc-time { min-width: 52px; text-align: center; }
.mc-time .t { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mc-time .d { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.mc-league {
  min-width: 44px; text-align: center;
  font-size: 10px; font-weight: 700; color: var(--text-2);
  padding: 3px 6px; border-radius: 6px; background: var(--bg-2);
  border: 1px solid var(--border);
}
.mc-teams { flex: 1; min-width: 0; }
.mc-team {
  display: flex; align-items: center; gap: 8px; padding: 2px 0;
  font-size: 13.5px; font-weight: 500;
}
.mc-team .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-team .en {
  font-size: 11px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mc-team img {
  width: 22px; height: 22px; object-fit: contain; flex-shrink: 0;
  background: #fff; border-radius: 50%; padding: 2px;
}
.mc-score { min-width: 64px; text-align: center; }
.mc-score .s { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mc-score .st { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.mc-score.live .s { color: var(--red); }
.mc-score.live .st { color: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.mc-pred {
  min-width: 64px; text-align: center; padding: 6px 10px;
  border-radius: 10px; background: var(--green-bg);
  border: 1px solid rgba(22, 199, 132, 0.3);
}
.mc-pred .ps { font-size: 15px; font-weight: 800; color: var(--green); }
.mc-pred .pc { font-size: 10px; color: var(--text-2); margin-top: 1px; }
.mc-alert {
  font-size: 10px; padding: 3px 6px; border-radius: 6px;
  background: var(--red-bg); color: var(--red); font-weight: 700;
  border: 1px solid rgba(234, 57, 67, 0.35);
}

/* ===== Date Group ===== */
.date-group { margin-bottom: 18px; }
/* 已完赛赛果区：绿色标题 + 轻微底色区分 */
.date-group.results-group { padding: 10px 12px; border: 1px solid rgba(34,197,94,.25); border-radius: 10px; background: rgba(34,197,94,.05); margin-bottom: 20px; }
.date-group.results-group .date-label { color: #22c55e; }
.date-group.results-group .date-label .dot { background: #22c55e; }
.date-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; color: var(--text-2);
  margin-bottom: 10px; letter-spacing: 0.03em;
}
.date-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.date-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.date-label.is-today { color: var(--gold); }
.date-label.is-today .dot { background: var(--gold); box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.15); }
.date-label.is-tomorrow .dot { background: var(--blue); }
.date-label .count { font-size: 10px; color: var(--text-3); font-weight: 400; }

/* 无价值信号场次:默认折叠,减少无效出手干扰 */
.no-signal { margin-top: 2px; }
.no-signal summary {
  cursor: pointer; list-style: none; font-size: 11px; color: var(--text-3);
  padding: 6px 10px; border-radius: 8px; background: var(--bg-2);
  display: inline-flex; align-items: center; gap: 6px; user-select: none;
}
.no-signal summary:hover { color: var(--text-2); }
.no-signal summary::before { content: '▸'; transition: transform .15s; }
.no-signal[open] summary::before { transform: rotate(90deg); }
.no-signal .match-list.dim { opacity: .55; filter: saturate(.6); }
.no-signal .match-list.dim .match-card { box-shadow: none; border-color: var(--border); }

/* 盘口走势(初盘→临场) */
.calib-card {
  padding: 12px 14px; border-radius: var(--radius); margin-bottom: 14px;
  background: linear-gradient(180deg, rgba(240,185,11,.06), rgba(240,185,11,.02));
  border: 1px solid rgba(240,185,11,.22);
}
.trend-row { display: flex; gap: 10px; flex-wrap: wrap; }
.trend-box {
  flex: 1; min-width: 110px; padding: 8px 10px; border-radius: var(--radius);
  background: var(--bg-2); border: 1px solid var(--border);
}
.trend-box .label { font-size: 11px; color: var(--text-2); margin-bottom: 4px; display: flex; justify-content: space-between; }
.trend-box svg { margin: 0 auto; }

/* ===== Standing Table ===== */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.standings { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
table.standings th {
  text-align: left; padding: 10px 12px; font-size: 11px; color: var(--text-3);
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
}
table.standings td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
table.standings tr:last-child td { border-bottom: none; }
table.standings tbody tr:hover { background: var(--surface-2); }
table.standings .pos { font-weight: 700; width: 36px; color: var(--text-2); }
table.standings .pos.top4 { color: var(--blue); }
table.standings .pos.releg { color: var(--red); }
table.standings .team { font-weight: 600; }
table.standings .team .en { color: var(--text-3); font-weight: 400; font-size: 11px; margin-left: 6px; }
table.standings .pts { font-weight: 800; color: var(--gold); }
table.standings .up { color: var(--green); }
table.standings .down { color: var(--red); }

/* ===== Filters ===== */
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  font-size: 12px; padding: 5px 12px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
  transition: all .15s;
}
.chip:hover { border-color: var(--border-light); color: var(--text); }
.chip.active { background: var(--gold); color: #0b0e14; font-weight: 700; border-color: var(--gold); }

.value-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(240,185,11,.15); color:var(--gold); border:1px solid rgba(240,185,11,.4); animation: pulse 1.5s infinite; }
.val-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; display:inline-block; }
.val-tag.gold { background:rgba(240,185,11,.15); color:#fbbf24; border:1px solid rgba(240,185,11,.5); }
.val-tag.watch { background:rgba(148,163,184,.12); color:#94a3b8; border:1px solid rgba(148,163,184,.35); }
.rec-chip { font-size:11px; padding:3px 10px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text-2); display:inline-flex; align-items:center; gap:4px; }
.rec-chip.gold { color:#fbbf24; border-color:rgba(240,185,11,.4); }
.stale-banner { padding:8px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; background:rgba(234,57,67,.1); color:#f87171; border:1px solid rgba(234,57,67,.3); }


/* ===== 异动/难度标签 ===== */
.hot-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.4); }
.diff-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
.diff-tag.hard { background:rgba(239,68,68,.12); color:#f87171; }
.diff-tag.mid { background:rgba(245,158,11,.12); color:#fbbf24; }
.diff-tag.easy { background:rgba(34,197,94,.12); color:#4ade80; }
.diff-tag.warn { background:rgba(168,85,247,.14); color:#c084fc; }

/* ===== Detail Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: none; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border-light);
  border-radius: 16px; max-width: 720px; width: 100%;
  box-shadow: var(--shadow-lg); animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 30px; height: 30px; border-radius: 8px; font-size: 18px;
  background: var(--bg-2); color: var(--text-2); display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 18px 22px; }

/* Market tabs */
.mkt-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.mkt-tab {
  font-size: 12px; padding: 6px 12px; border-radius: 8px;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2);
}
.mkt-tab.active { background: var(--gold); color: #0b0e14; font-weight: 700; border-color: var(--gold); }
.odds-collapse { margin-bottom: 12px; }
.odds-collapse summary { cursor: pointer; font-size: 13px; color: var(--text-3); padding: 8px 0; font-weight: 600; }
.odds-collapse summary:hover { color: var(--text); }
.odds-collapse[open] summary { margin-bottom: 8px; }
.odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.odds-box {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; text-align: center;
}
.odds-box .label { font-size: 11px; color: var(--text-3); }
.odds-box .value { font-size: 18px; font-weight: 800; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.odds-box .value.hot { color: var(--gold); }
.odds-box .sub { font-size: 10.5px; color: var(--text-2); }
.odds-box .diff { font-size: 10.5px; font-weight: 600; }
.odds-box .diff.up { color: var(--red); }
.odds-box .diff.down { color: var(--green); }
.odds-box .diff.flat { color: var(--text-3); }
.cs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.cs-item {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px; text-align: center;
}
.cs-item .score { font-weight: 800; font-size: 14px; }
.cs-item .p { font-size: 11px; color: var(--text-2); }
.section-title {
  font-size: 12px; font-weight: 700; color: var(--text-2);
  margin: 16px 0 8px; display: flex; align-items: center; gap: 6px;
}
.analysis-box {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; font-size: 12.5px; line-height: 1.8;
  white-space: pre-wrap; color: var(--text);
}
.analysis-box .hl { color: var(--gold); font-weight: 600; }
.analysis-actions { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; }
.btn {
  font-size: 12.5px; padding: 7px 14px; border-radius: 8px;
  background: var(--gold); color: #0b0e14; font-weight: 700; transition: all .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-weight: 500; }
.refresh-note { font-size: 11px; color: var(--text-2); flex: 1; }

/* Stats (record) */
.record-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
.rec-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; text-align: center;
}
.rec-card .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ===== 赛果页（模型/AI 预测对照）===== */
.res-list { display: flex; flex-direction: column; gap: 10px; }
.res-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.res-head { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.res-score { font-size: 18px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.res-date { margin-left: auto; font-size: 11px; color: var(--text-3); }
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.res-cell { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.res-cell .k { font-size: 10px; color: var(--text-3); margin-bottom: 4px; }
.res-cell .v { font-size: 14px; font-weight: 700; }
.res-cell .s { font-size: 11px; color: var(--text-2); margin-top: 3px; line-height: 1.5; }
.res-cell .hit { color: var(--green); font-size: 11px; margin-left: 6px; }
.res-cell .miss { color: var(--red); font-size: 11px; margin-left: 6px; }
@media (max-width: 560px) {
  .res-grid { grid-template-columns: 1fr; }
}
.rec-card .v.gold { color: var(--gold); }
.rec-card .v.green { color: var(--green); }
.rec-card .v.red { color: var(--red); }
.rec-card .k { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.record-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; font-size: 12.5px;
}
.record-row .res {
  font-size: 16px; width: 22px; text-align: center;
}
.record-row .hit { color: var(--green); }
.record-row .miss { color: var(--red); }
.record-row .pred { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.record-row .actual { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Empty / loading */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text-3);
  border: 1px dashed var(--border); border-radius: var(--radius);
}
.empty-state .icon { font-size: 32px; margin-bottom: 10px; }
.spinner {
  width: 28px; height: 28px; border: 3px solid var(--border);
  border-top-color: var(--gold); border-radius: 50%;
  animation: spin .8s linear infinite; margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .header-inner { padding: 10px 14px; }
  .main { padding: 12px 14px 50px; }
  .match-card { padding: 10px 12px; gap: 10px; }
  .mc-time { min-width: 44px; }
  .mc-team { font-size: 12.5px; }
  .mc-team .en { display: none; }
  .mc-pred { min-width: 54px; padding: 5px 8px; }
  .modal { padding: 0; }
  .modal-header, .modal-body { padding: 14px 16px; }
  .odds-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
}

/* ── 移动端增强(<768px 平板 & <480px 手机)── */
@media (max-width: 768px) {
  .record-row { flex-wrap: wrap; gap: 4px 6px; font-size: 12px; padding: 8px 4px; }
  .record-row span { flex: 1 1 auto; }
  .record-row .res { flex: 0 0 auto; }
  .mkt-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .mkt-tab { flex: 0 0 auto; white-space: nowrap; }
  .trend-row { flex-wrap: wrap; }
  .trend-box { flex: 1 1 40%; min-width: 120px; }
  .calib-card { overflow-x: auto; }
  .table-wrap { -webkit-overflow-scrolling: touch; }
  .topbar-chips { flex-wrap: wrap; }
  .odds-box .sub { font-size: 10px; }
  .match-card { align-items: center; }
}
@media (max-width: 480px) {
  .header-right .header-time { display: none; }
  .league-nav, .sub-nav { font-size: 13px; }

<script>
// ===== 常量 =====
const LEAGUES = [
  { code: 'PL',  name: '英超', en: 'Premier League', color: '#3d195b', abbr: 'PL' },
  { code: 'PD',  name: '西甲', en: 'La Liga',        color: '#c9252e', abbr: 'PD' },
  { code: 'BL1', name: '德甲', en: 'Bundesliga',     color: '#d20515', abbr: 'BL1' },
  { code: 'SA',  name: '意甲', en: 'Serie A',        color: '#0a5c36', abbr: 'SA' },
  { code: 'FL1', name: '法甲', en: 'Ligue 1',        color: '#091c3e', abbr: 'FL1' },
  { code: 'CL',  name: '欧冠', en: 'Champions League', color: '#103f68', abbr: 'CL' },
];
const SUBS = [
  { id: 'fixtures', name: '📋 赛程' },
  { id: 'results', name: '⚽ 赛果' },
  { id: 'standings', name: '🏆 积分榜' },
];
// Football-Data 赛程代码 ↔ 展示代码
const FD_CODE = { PL: 'PL', PD: 'PD', SA: 'SA', BL1: 'BL1', FL1: 'FL1', CL: 'CL' };
const COMPETITIONS = { PL: '英超', PD: '西甲', SA: '意甲', BL1: '德甲', FL1: '法甲', CL: '欧冠' };
const LEAGUE_CN = { PL: '英格兰超级联赛', PD: '西班牙甲级联赛', SA: '意大利甲级联赛', BL1: '德国甲级联赛', FL1: '法国甲级联赛', CL: '欧洲冠军联赛' };
const ODDS_MOVE_THRESHOLD = 0.2; // 赔率异动阈值(与列表页🔥标签、详情页箭头一致)

// ===== 状态 =====
let state = {
  league: 'PL',
  sub: 'fixtures',
  fixtures: [],       // 全部赛程
  standings: {},      // 积分榜 {code: [...]}
  predictions: [],    // 预测
  predictionsMeta: null,
  history: null,      // 预测战绩
  teamNames: {},
  calibration: null,  // 模型校准报告
  oddsByLeague: {},   // 赔率 {code: {matches, history}}
};

// ===== 工具 =====
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 译名别名归一化(不同英文写法指向同一队)
const TEAM_ALIAS = {
  'bayern munchen': 'bayern', 'bayern munich': 'bayern',
  'internazionale milano': 'inter milan', 'inter milan': 'inter milan', 'inter': 'inter milan',
  'athletic club': 'athletic bilbao', 'athletic bilbao': 'athletic bilbao',
  'paris saint germain': 'psg', 'paris saint-germain': 'psg', 'psg': 'psg',
  'manchester united': 'man utd', 'manchester united fc': 'man utd', 'man utd': 'man utd',
  'manchester city': 'man city', 'manchester city fc': 'man city', 'man city': 'man city',
  'spartak moscow': 'spartak', 'cska moscow': 'cska',
  'stade rennais 1901': 'rennes', 'stade rennais': 'rennes', 'rennes': 'rennes',
};
function normTeam(s) {
  let n = (s || '').toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')  // ü->u, é->e
    .replace(/\b(fc|afc|cf|sc|ac)\b/g, '')
    .replace(/[-\u2013\u2014]/g, ' ')   // 连字符变空格(saint-germain -> saint germain)
    .replace(/[^\u4e00-\u9fa5a-z0-9 ]/g, '')  // 保留中文(队名可能含中文),其余非字母数字清掉
    .trim().replace(/\s+/g, ' ');
  return TEAM_ALIAS[n] || n;
}
// 队名匹配:精确 → 包含 → 末尾词(SV 07 Elversberg vs Elversberg)
function teamMatch(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  if (a.includes(b) || b.includes(a)) return true;
  // 全词包含:查询词全部出现在对方队名(防 Real Madrid ↔ Atlético Madrid 末词误配)
  const wa = a.split(' ').filter(Boolean), wb = b.split(' ').filter(Boolean);
  if (wa.length >= 2 && wa.every(w => wb.includes(w))) return true;
  if (wb.length >= 2 && wb.every(w => wa.includes(w))) return true;
  // 末词兜底:仅当双方词数>=2 且末词足够长(>=5),避免通用词误配
  if (wa.length >= 2 && wb.length >= 2) {
    const la = wa[wa.length - 1], lb = wb[wb.length - 1];
    return la.length >= 5 && la === lb;
  }
  return false;
}
function cnTeam(name) {
  if (!name) return '?';
  const n = state.teamNames[name] || state.teamNames[name.replace(/\s+(FC|CF|SC|AFC)$/i, '')];
  return n || name;
}
function fmtDate(utcStr) {
  const d = new Date(utcStr), bj = new Date(d.getTime() + 8 * 3600000);
  return `${bj.getUTCFullYear()}-${String(bj.getUTCMonth()+1).padStart(2,'0')}-${String(bj.getUTCDate()).padStart(2,'0')}`;
}
function fmtTime(utcStr) {
  const d = new Date(utcStr), bj = new Date(d.getTime() + 8 * 3600000);
  return `${String(bj.getUTCHours()).padStart(2,'0')}:${String(bj.getUTCMinutes()).padStart(2,'0')}`;
}
function todayBJ() {
  const bj = new Date(Date.now() + 8 * 3600000);
  return `${bj.getUTCFullYear()}-${String(bj.getUTCMonth()+1).padStart(2,'0')}-${String(bj.getUTCDate()).padStart(2,'0')}`;
}
function dateLabel(dateStr) {
  const t = todayBJ();
  const tm = fmtDate(new Date(Date.now() + 86400000).toISOString());
  if (dateStr === t) return '今天';
  if (dateStr === tm) return '明天';
  const d = new Date(dateStr + 'T00:00:00Z');
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return `${d.getUTCMonth()+1}月${d.getUTCDate()}日 ${days[d.getUTCDay()]}`;
}
function findPrediction(home, away, league) {
  const h = normTeam(home), a = normTeam(away);
  // 日期过滤:优先匹配开赛日期±1天的场次(防同队两回合/多交手的旧预测串场)
  const cands = (state.predictions || []).filter(p =>
    (!league || p.league === league) &&
    teamMatch(normTeam(p.homeTeam), h) && teamMatch(normTeam(p.awayTeam), a));
  if (!cands.length) return null;
  if (cands.length === 1) return cands[0];
  const t = todayBJ(), tm = fmtDate(new Date(Date.now() + 86400000).toISOString());
  for (const day of [t, tm]) {
    const hit = cands.find(p => fmtDate(p.kickoff) === day);
    if (hit) return hit;
  }
  return cands[0];
}

// ===== 数据加载 =====
// 缓存策略：数据文件带 ?v=<version>（版本号 = CI 对全部数据文件的 MD5 汇总），
// 数据变化 → 版本变化 → URL 变化 → 重新下载；数据未变 → 命中缓存（性能关键）。
// version.json 本身极小且每次必须新鲜（?t=now 冷拉）；本地无 version.json 时自动降级 ?t=now。
let DATA_VERSION = null;
async function loadJson(url) {
  const q = (DATA_VERSION && !url.includes('version.json')) ? '?v=' + DATA_VERSION : '?t=' + Date.now();
  const r = await fetch(url + q);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ===== 数据状态抽屉(模块描述表,与 CI 生成的 status.json key 对齐)=====
// staleAfter: 秒。gray: 正常无数据时灰灯(不报红)。
const STATUS_MODULES = [
  { key: 'fixtures',       label: '赛程/赛果',   source: 'football-data.org', cadence: '每 30 分钟', staleAfter: 5400,  note: '' },
  { key: 'odds',           label: '欧赔',        source: 'The Odds API',      cadence: '每天 10:00', staleAfter: 90000, note: '' },
  { key: 'predictions',    label: '预测模型',    source: '云端管线',           cadence: '每 30 分钟', staleAfter: 7200,  note: '' },
  { key: 'messages',       label: '新闻消息',    source: 'ESPN/Sky RSS',      cadence: '每天',       staleAfter: 172800, note: '' },
  { key: 'standings',      label: '积分榜',      source: 'football-data.org', cadence: '每天',       staleAfter: 172800, note: '' },
];

let statusData = null;        // 最近一次拉到的 status.json
let statusTimer = null;       // 每 60s 刷新相对时间
let statusPollTimer = null;   // 每 5 分钟重拉 status.json

async function loadStatus() {
  try {
    statusData = await loadJson('data/status.json');
  } catch (e) {
    statusData = null;
  }
  updateStatusUI();
}

function timeAgo(iso) {
  if (!iso) return '无记录';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '无记录';
  const diff = Math.max(0, Date.now() - t);
  const m = Math.floor(diff / 60000), h = Math.floor(diff / 3600000), d = Math.floor(diff / 86400000);
  if (d >= 7) return d + ' 天前';
  if (d >= 1) return d + ' 天 ' + Math.floor((diff % 86400000) / 3600000) + ' 小时前';
  if (h >= 1) return h + ' 小时 ' + Math.floor((diff % 3600000) / 60000) + ' 分钟前';
  if (m >= 1) return m + ' 分钟前';
  return '刚刚';
}

function absTime(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  if (isNaN(t.getTime())) return '';
  // 强制北京时间(UTC+8),不依赖浏览器本地时区
  const opts = { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Shanghai' };
  return ' · ' + t.toLocaleString('zh-CN', opts);
}

function statusLight(mod, m) {
  // 灰灯:正常无数据(首发未公布等)
  if (!m || m.updatedAt == null) {
    if (mod.gray) return 'st-gray';
    return m && m.ok === false ? 'st-red' : 'st-gray';
  }
  if (!m.ok) return 'st-red';
  // 统一阈值(北京时间):≤1天 绿,>1天 且 ≤2天 黄,>2天 红
  // 所有数据源至少超过 1 天才提示偏旧,避免抓取延迟数小时就误报
  const age = Date.now() - new Date(m.updatedAt).getTime();
  if (isNaN(age)) return 'st-gray';
  const H = 3600000;
  if (age <= 24 * H) return 'st-green';
  if (age <= 48 * H) return 'st-yellow';
  return 'st-red';
}

function renderStatus() {
  const list = $('statusList');
  const summary = $('statusSummary');
  if (!list) return;
  const mods = statusData ? statusData.modules : [];
  const byKey = {};
  for (const m of mods) byKey[m.key] = m;

  let bad = 0, warn = 0;
  const rows = STATUS_MODULES.map(mod => {
    const m = byKey[mod.key];
    const cls = statusLight(mod, m);
    if (cls === 'st-red') bad++;
    if (cls === 'st-yellow') warn++;
    const dot = `<span class="st-dot ${cls}"></span>`;
    const localTag = mod.local ? ' <span class="tag-local">本地</span>' : '';
    const l2 = m && m.updatedAt
      ? `${timeAgo(m.updatedAt)}${absTime(m.updatedAt)}`
      : (m && m.ok === false ? '抓取失败/文件缺失' : '暂无数据');
    let l4 = '';
    if (m && m.updatedAt && mod.staleAfter > 0) {
      const age = Date.now() - new Date(m.updatedAt).getTime();
      // 所有数据源至少超过 1 天才显示"已超过常规更新间隔",避免延迟数小时误报
      const MIN_STALE_MS = 24 * 3600000;
      if (age > Math.max(mod.staleAfter * 1000, MIN_STALE_MS)) {
        l4 = `<span style="color:${cls === 'st-red' ? '#ef4444' : '#eab308'}">⚠️ 已超过常规更新间隔</span>`;
      }
    }
    if (mod.key === 'odds' && statusData && statusData.oddsQuota && statusData.oddsQuota.totalRemaining != null) {
      l4 = (l4 ? l4 + ' · ' : '') + '本月剩余配额 ' + statusData.oddsQuota.totalRemaining + ' 次';
    }
    if (mod.note) {
      l4 = (l4 ? l4 + ' · ' : '') + mod.note;
    }
    return `<div class="status-row">
      <div class="l1">${dot}<b>${mod.label}</b><span style="color:var(--muted);font-size:11px">${mod.source}</span>${localTag}</div>
      <div class="l2">${l2}</div>
      <div class="l3">${mod.cadence}${m && m.files ? ' · 文件 ' + m.files : ''}${m && m.missing && m.missing.length ? `<span style="color:#eab308"> · 缺失: ${m.missing.join(', ')}</span>` : ''}</div>
      ${l4 ? `<div class="l4">${l4}</div>` : ''}
    </div>`;
  }).join('');

  list.innerHTML = rows;
  const total = STATUS_MODULES.length;
  summary.textContent = `${total} 个模块${bad ? ' · ' + bad + ' 个异常' : ''}${warn ? ' · ' + warn + ' 个偏旧' : ''}`;
  // header 红点
  const dot = $('statusDot');
  if (dot) dot.style.display = (bad > 0) ? 'block' : 'none';
  // 页脚简版:取最关键的 4 个
  const pick = ['fixtures', 'odds', 'predictions'];
  const footTxt = pick.map(k => {
    const mod = STATUS_MODULES.find(x => x.key === k);
    const m = byKey[k];
    return mod.label + ' ' + (m && m.updatedAt ? timeAgo(m.updatedAt) : '无数据');
  }).join(' · ');
  const foot = $('footerStatus');
  if (foot) foot.textContent = '数据更新:' + footTxt;
}

function updateStatusUI() { renderStatus(); }

function openStatus() {
  const ov = $('statusOverlay');
  if (ov) { ov.classList.add('show'); renderStatus(); }
  // 打开时强制重拉一次最新状态
  loadStatus();
  if (!statusTimer) statusTimer = setInterval(() => { if ($('statusOverlay').classList.contains('show')) renderStatus(); }, 60000);
  if (!statusPollTimer) statusPollTimer = setInterval(loadStatus, 5 * 60000);
}

function closeStatus() {
  const ov = $('statusOverlay');
  if (ov) ov.classList.remove('show');
}

async function loadAll() {
  // 先取版本指纹（小文件、恒新鲜），失败则降级为旧策略 ?t=now
  try {
    const v = await loadJson('data/version.json');
    DATA_VERSION = v.version || null;
  } catch (e) {
    DATA_VERSION = null;
  }
  const failed = [];
  const track = (name, p) => p.catch(() => { failed.push(name); });
  const jobs = [
    track('status.json', loadJson('data/status.json').then(d => { statusData = d; })),
    track('fixtures.json', loadJson('data/fixtures.json').then(d => { state.fixtures = d.matches || []; })),
    track('predictions.json', loadJson('data/predictions.json').then(d => { state.predictions = d.predictions || []; state.predictionsMeta = d; })),
    track('standings.json', loadJson('data/standings.json').then(d => { state.standings = d.standings || {}; })),
    track('prediction_history.json', loadJson('data/prediction_history.json').then(d => { state.history = d; })),
    track('calibration.json', loadJson('data/calibration.json').then(d => { state.calibration = d; })),
    track('calibration_ou.json', loadJson('data/calibration_ou.json').then(d => { state.calibOu = d; })),
    track('team_names.json', loadJson('data/team_names.json').then(d => { state.teamNames = d; })),
  ];
  // 赔率快照(含初盘→临场 history)逐个联赛加载
  for (const lg of LEAGUES) {
    jobs.push(loadJson(`data/odds/${lg.code}.json`).then(d => { state.oddsByLeague[lg.code] = d; }).catch(() => {}));
  }
  await Promise.all(jobs);
  updateStatusUI();  // 数据状态红点/页脚随每次 loadAll 刷新
  // 加载失败提示:file:// 直开或部署缺文件时不再白屏无解释
  if (failed.length) {
    const el = $('pageContent');
    if (el && !el.querySelector('.load-error')) {
      el.insertAdjacentHTML('afterbegin', '<div class="stale-banner load-error" style="background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)">⚠️ 数据加载失败: ' + failed.join(', ') + '。若你是直接双击打开 index.html,请改用 GitHub Pages 地址或本地服务器(如 python -m http.server)。</div>');
    }
  }
  const d = state.history?.stats;
  const gen = state.predictionsMeta?.generatedAt;
  if (gen) $('lastUpdated').textContent = '数据 ' + gen.slice(5, 16).replace('T', ' ');
  // 数据过期提示(>12 小时)
  if (gen) {
    const age = Date.now() - new Date(gen).getTime();
    if (age > 12 * 3600000) {
      const el = $('pageContent');
      if (el && !el.querySelector('.stale-banner')) {
        el.insertAdjacentHTML('afterbegin', '<div class="stale-banner">⚠️ 数据已超过 12 小时未更新(' + gen.slice(0, 16).replace('T', ' ') + ' UTC)。每日 10:00 自动更新,也可点右上角刷新。</div>');
      }
    }
  }
  renderNav();
  render();
}

// ===== 串关推荐(全局页,跨联赛组合)=====
function renderParlay() {
  // 模型概率按校准打折 85%(模型偏乐观);组合赔率 >15 的搏冷组合过滤
  const probDiscount = 0.85;
  const MAX_ODDS = 15;
  const sigs = (state.predictions || []).filter(x =>
    x.league && x.valuePicks && x.valuePicks.length && !x.diverge &&
    (x.valuePicks.some(v => v.edge > 0.1)));
  const combos = [];
  const cands = sigs.slice(0, 8);
  for (let i = 0; i < cands.length; i++) {
    for (let j = i + 1; j < cands.length; j++) {
      const v1 = cands[i].valuePicks.find(v => v.edge > 0.1), v2 = cands[j].valuePicks.find(v => v.edge > 0.1);
      if (!v1 || !v2) continue;
      const o1 = (cands[i].rawOdds || {})[v1.side], o2 = (cands[j].rawOdds || {})[v2.side];
      if (!o1 || !o2) continue;
      const odds = o1 * o2;
      if (odds > MAX_ODDS) continue;
      const prob = v1.modelProb * v2.modelProb * probDiscount * probDiscount;
      combos.push({
        legs: [cands[i], cands[j]], picks: [v1, v2], odds: odds, prob: prob,
        exp: odds * prob, label: `${cnTeam(cands[i].homeTeam)}${v1.label}×${cnTeam(cands[j].homeTeam)}${v2.label}`,
      });
    }
  }
  for (let i = 0; i < Math.min(3, cands.length); i++) {
    for (let j = i + 1; j < Math.min(4, cands.length); j++) {
      for (let k = j + 1; k < Math.min(5, cands.length); k++) {
        const a = cands[i], b = cands[j], c = cands[k];
        const va = a.valuePicks.find(v => v.edge > 0.1), vb = b.valuePicks.find(v => v.edge > 0.1), vc = c.valuePicks.find(v => v.edge > 0.1);
        if (!va || !vb || !vc) continue;
        const oa = (a.rawOdds || {})[va.side], ob = (b.rawOdds || {})[vb.side], oc = (c.rawOdds || {})[vc.side];
        if (!oa || !ob || !oc) continue;
        const odds = oa * ob * oc;
        if (odds > MAX_ODDS) continue;
        const prob = va.modelProb * vb.modelProb * vc.modelProb * Math.pow(probDiscount, 3);
        combos.push({
          legs: [a, b, c], picks: [va, vb, vc], odds: odds, prob: prob, exp: odds * prob,
          label: `${cnTeam(a.homeTeam)}${va.label}×${cnTeam(b.homeTeam)}${vb.label}×${cnTeam(c.homeTeam)}${vc.label}`,
        });
      }
    }
  }
  combos.sort((x, y) => (y.exp * y.prob) - (x.exp * x.prob));
  if (!combos.length) {
    return '<div class="empty-state"><div class="icon">🎯</div>暂无串关候选<div style="font-size:11px;margin-top:8px;color:var(--text-3)">需要至少 2 场有价值信号且无分歧的比赛,开赛后自动出现</div></div>';
  }
  const bestExp = combos[0]?.exp || 0;
  return '<div class="section-title" style="margin-bottom:8px">🎯 串关建议(价值信号 × 无分歧)</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">按综合评分排序:组合赔率 × 打折后概率。模型概率已按校准打折 85%(模型偏乐观),组合赔率 &gt;15 的搏冷组合已过滤。跨联赛组合,任一腿失败即全输。</div>' +
    combos.slice(0, 8).map(c => {
      const legsTxt = c.legs.map((l, i) => '<b>' + cnTeam(l.homeTeam) + ' vs ' + cnTeam(l.awayTeam) + '</b> → ' + c.picks[i].label + ' @' + ((l.rawOdds || {})[c.picks[i].side] || '-')).join('<br>');
      return `<div style="padding:10px 12px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);margin-bottom:8px">
        <div style="font-weight:700;font-size:12px">${c.label}</div>
        <div style="font-size:11px;color:var(--muted);margin:4px 0">${legsTxt}</div>
        <div style="font-size:12px">组合赔率 <b style="color:var(--gold)">${c.odds.toFixed(2)}</b> · 打折后概率 ${(c.prob * 100).toFixed(1)}% · 期望值 ${c.exp.toFixed(2)}${c.exp > 1.05 ? ' <span style="color:#22c55e;font-weight:700">值得</span>' : ''}${c.exp === bestExp ? ' <span style="color:var(--gold)">🏆 最优</span>' : ''}</div>
      </div>`;
    }).join('') +
    '<div style="font-size:10px;color:var(--muted);margin-top:8px">概率 = 各腿模型概率相乘(独立假设)× 校准折扣 85%;期望值 &gt;1.05 才值得考虑。串关高风险,仅建议小注娱乐。</div>';
}

// ===== 赛程 =====
function renderFixtures() {
  const code = FD_CODE[state.league];
  const all = state.fixtures.filter(m => m.competition?.code === code);

  let ms = all;
  // 常规模式基准(展示模式分支也使用)
  const t = todayBJ();
  const maxD = fmtDate(new Date(Date.now() + 30 * 86400000).toISOString());
  const now = Date.now();
  // 展示模式:已完赛倒序(最近在前),最多 120 场
  const finished = ms.filter(m => m.status === 'FINISHED');
  if (finished.length >= ms.length * 0.8) {
    ms = finished.sort((a, b) => b.utcDate.localeCompare(a.utcDate)).slice(0, 120);
  } else {
    // 常规模式:今天 + 未来 30 天
    ms = ms.filter(m => {
      const d = fmtDate(m.utcDate);
      if (d < t || d > maxD) return false;
      if (now - new Date(m.utcDate).getTime() > 2.5 * 3600000) return false;
      return true;
    }).sort((a, b) => a.utcDate.localeCompare(b.utcDate));
  }

  // 赛程里没有的(如欧冠未开赛)→ 用预测补充(首词兜底匹配,避免重复显示)
  const hasFix = (h, a) => ms.some(m => {
    const mh = normTeam(m.homeTeam?.name || m.homeTeam?.shortName);
    const ma = normTeam(m.awayTeam?.name || m.awayTeam?.shortName);
    return teamMatch(mh, h) && teamMatch(ma, a);
  });
  // 已结束/延期/取消的对阵不再用预测补充挂回赛程(避免已完赛比赛显示成未开赛)
  const hasClosed = (h, a) => all.some(m => {
    const mh = normTeam(m.homeTeam?.name || m.homeTeam?.shortName);
    const ma = normTeam(m.awayTeam?.name || m.awayTeam?.shortName);
    if (!teamMatch(mh, h) || !teamMatch(ma, a)) return false;
    return ['FINISHED', 'POSTPONED', 'CANCELLED', 'AWARDED', 'SUSPENDED', 'ABANDONED'].includes(m.status);
  });
  const extras = (state.predictions || []).filter(p => p.league === state.league)
    .filter(p => !hasFix(normTeam(p.homeTeam), normTeam(p.awayTeam)))
    .filter(p => !hasClosed(normTeam(p.homeTeam), normTeam(p.awayTeam)))
    .filter(p => { const d = fmtDate(p.kickoff); return d >= t && d <= maxD; })
    .map(p => ({ synthetic: true, homeTeam: { name: p.homeTeam }, awayTeam: { name: p.awayTeam }, utcDate: p.kickoff, competition: { code: p.league }, pred: p }));
  ms = ms.concat(extras).sort((a, b) => a.utcDate.localeCompare(b.utcDate));

  // 未来赛程为空但已有赛果时，仍显示赛果区（空态提示放到赛果下方）
  if (!ms.length && !finishedAll.length) return `<div class="empty-state"><div class="icon">📭</div>${state.league === 'CL' ? '欧冠正赛 9 月中旬开赛,暂无可抓数据(资格赛/附加赛不收录)' : '该联赛暂无未来比赛安排'}</div>`;

  // 分组(按日期从近到远升序)
  const groups = {};
  ms.forEach(m => { const d = fmtDate(m.utcDate); (groups[d] = groups[d] || []).push(m); });
  const groupOrder = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  const upcomingHtml = groupOrder.map(d => { const list = groups[d];
    const t2 = todayBJ(), tm = fmtDate(new Date(Date.now() + 86400000).toISOString());
    const cls = d === t2 ? 'is-today' : d === tm ? 'is-tomorrow' : '';
    // 出手建议:有价值信号/异动/高置信预测的优先展示,其余折叠降噪
    const hasSig = m => {
      const p = m.pred || findPrediction(m.homeTeam?.name || m.homeTeam?.shortName, m.awayTeam?.name || m.awayTeam?.shortName, m.competition?.code);
      if (p && p.valuePicks && p.valuePicks.length) return true;
      if (p && p.oddsChange && ['home','draw','away'].some(k => p.oddsChange[k] != null && Math.abs(p.oddsChange[k]) >= ODDS_MOVE_THRESHOLD)) return true;
      if (p && p.confidence != null && p.confidence >= 0.55) return true;
      return false;
    };
    const sig = list.filter(hasSig), rest = list.filter(m => !hasSig(m));
    return `<div class="date-group">
      <div class="date-label ${cls}"><span class="dot"></span>${dateLabel(d)} <span class="count">${list.length} 场</span></div>
      ${sig.length ? `<div class="match-list">${sig.map(renderCard).join('')}</div>` : ''}
      ${rest.length ? `<details class="no-signal"><summary>其他 ${rest.length} 场(无价值信号)</summary><div class="match-list dim">${rest.map(renderCard).join('')}</div></details>` : ''}
    </div>`;
  }).join('');
  return upcomingHtml;
}

// ===== 赛果（含当时模型/AI 预测对照）=====
function renderResults() {
  const code = FD_CODE[state.league];
  const h = state.history;
  // league 缺失的旧记录：用 fixtures 已完赛场次做队名模糊匹配推断联赛归属
  const finByCode = {};
  (state.fixtures || []).forEach(f => {
    if (f.status === 'FINISHED') {
      const c = f.competition?.code;
      const key = normTeam(f.homeTeam?.name) + '|' + normTeam(f.awayTeam?.name);
      finByCode[key] = c;
    }
  });
  const belongs = (r) => {
    if (r.league) return r.league === code;
    // 无 league：查 fixtures 同对阵（含首词模糊）的完赛场次归属
    const rk = normTeam(r.homeTeam) + '|' + normTeam(r.awayTeam);
    if (finByCode[rk]) return finByCode[rk] === code;
    const rh = normTeam(r.homeTeam), ra = normTeam(r.awayTeam);
    for (const f of (state.fixtures || [])) {
      if (f.status !== 'FINISHED') continue;
      const fh = normTeam(f.homeTeam?.name), fa = normTeam(f.awayTeam?.name);
      // 匹配：完全相等 / 首词相等(≥4字符) / 一方核心词包含在另一方队名中
      const hitH = rh === fh || (rh && fh && (rh.includes(fh) || fh.includes(rh) ||
        (rh.split(' ')[0] === fh.split(' ')[0] && rh.split(' ')[0].length >= 4)));
      const hitA = ra === fa || (ra && fa && (ra.includes(fa) || fa.includes(ra) ||
        (ra.split(' ')[0] === fa.split(' ')[0] && ra.split(' ')[0].length >= 4)));
      if (hitH && hitA) return f.competition?.code === code;
    }
    return false;
  };
  const results = (h && h.results ? h.results : []).filter(belongs)
    .sort((a, b) => (b.kickoff || '').localeCompare(a.kickoff || ''));
  if (!results.length) return `<div class="empty-state"><div class="icon">⚽</div>该联赛暂无已完赛赛果(开赛后自动结算,显示当时模型/AI 预测 vs 实际比分)</div>`;

  const cn = (s) => state.teamNames[s] || s;
  const pickCn = { home: '主胜', draw: '平局', away: '客胜', none: '不碰' };
  const outcomeOf = (s) => { if (!s) return 'draw'; const [a, b] = String(s).split('-').map(Number); if (a > b) return 'home'; if (a < b) return 'away'; return 'draw'; };

  const rows = results.map(r => {
    const mp = r.modelProbs || r.probabilities || {};
    const pct = (v) => v == null ? '—' : Math.round(v * 100) + '%';
    const mOut = outcomeOf(r.predictedScore), aOut = outcomeOf(r.actualScore);
    // 比分精确命中 + 胜负方向命中分开计算
    const mExact = r.predictedScore === r.actualScore;
    const mHit = mOut === aOut;
    const aiExact = r.aiScore === r.actualScore;
    const aiHit = r.aiPick != null && r.aiPick !== 'none' ? r.aiPick === aOut : null;
    const mScoreTxt = `<span class="${mExact ? 'hit' : 'miss'}">比分${mExact ? '✓' : '✗'}</span> <span class="${mHit ? 'hit' : 'miss'}">胜负${mHit ? '✓' : '✗'}</span>`;
    const aiScoreTxt = aiHit === null ? '' : `<span class="${aiExact ? 'hit' : 'miss'}">比分${aiExact ? '✓' : '✗'}</span> <span class="${aiHit ? 'hit' : 'miss'}">胜负${aiHit ? '✓' : '✗'}</span>`;
    return `<div class="res-card">
      <div class="res-head"><b>${cn(r.homeTeam)}</b> <span class="res-score">${r.actualScore || '—'}</span> <b>${cn(r.awayTeam)}</b>
        <span class="res-date">${(r.kickoff || '').slice(0, 10)}</span></div>
      <div class="res-grid">
        <div class="res-cell model">
          <div class="k">🤖 模型预测</div>
          <div class="v">${r.predictedScore || '—'} ${mScoreTxt}</div>
          <div class="s">主${pct(mp.home)} 平${pct(mp.draw)} 客${pct(mp.away)}</div>
        </div>
        <div class="res-cell ai">
          <div class="k">✨ AI 研判</div>
          <div class="v">${r.aiPick && r.aiPick !== 'none' ? pickCn[r.aiPick] + (r.aiScore ? ' ' + r.aiScore : '') : '无明显倾向'} ${aiScoreTxt}</div>
          <div class="s">${r.aiConfidence != null ? '置信 ' + Math.round(r.aiConfidence * 100) + '%' : ''}${r.aiReason ? ' · ' + esc(r.aiReason) : ''}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  return `<div class="res-list">${rows}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px">模型预测 = 预测时的融合模型比分与胜率;AI 研判 = 预测时的 DeepSeek 输出;比分✓ = 预测比分与实际完全一致;胜负✓ = 胜负方向与实际一致。开赛后自动累计。</div>`;
}

function renderCard(m) {
  const homeName = m.homeTeam?.name || m.homeTeam?.shortName || '?';
  const awayName = m.awayTeam?.name || m.awayTeam?.shortName || '?';
  const pred = m.pred || findPrediction(homeName, awayName, m.competition?.code);
  const score = getScore(m);
  // 异动标红:赔率涨跌 >= 0.2
  let hot = '';
  // 模型价值标记(Elo 与市场差值 >= 10%)
  let value = '';
  if (pred && pred.valuePicks && pred.valuePicks.length) {
    value = '<span class="value-tag">💰 ' + pred.valuePicks.map(v => v.label).join('/') + '</span>';
  }
  if (pred && pred.oddsChange) {
    const oc = pred.oddsChange;
    const chg = ['home','draw','away'].filter(k => oc[k] != null && Math.abs(oc[k]) >= ODDS_MOVE_THRESHOLD)
      .map(k => ({ k, d: oc[k] })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    if (chg.length) {
      const names = { home: '主', draw: '平', away: '客' };
      const dir = chg[0].d > 0 ? '升' : '降';
      hot = '<span class="hot-tag" title="' + chg.map(c => names[c.k] + '胜赔率' + (c.d > 0 ? '↑' : '↓') + Math.abs(c.d).toFixed(2)).join('、') + '">🔥' + names[chg[0].k] + '胜' + dir + Math.abs(chg[0].d).toFixed(2) + '</span>';
    }
  }
  // 赛程难度评级:基于积分榜排名
  let diff = '';
  const st = state.standings?.[m.competition?.code];
  if (st && m.homeTeam?.name) {
    const norm = (s) => (s || '').toLowerCase().replace(/\b(fc|afc|cf|sc)\b/g, '').replace(/[^a-z0-9 ]/g, '').trim();
    const findR = (name) => { const n = norm(name); const r = st.find(x => norm(x.team) === n || norm(x.shortName || '') === n); return r ? r.position : null; };
    const rh = findR(m.homeTeam.name), ra = findR(m.awayTeam.name);
    if (rh && ra) {
      const opp = Math.min(rh, ra);
      if (opp <= 3) diff = '<span class="diff-tag hard">强强</span>';
      else if (opp <= 8) diff = '<span class="diff-tag mid">中上</span>';
      else if (opp >= 15) diff = '<span class="diff-tag easy">悬殊</span>';
    }
  }
  // 模型分歧:Elo vs DC vs 市场方向不一致 → 提示不碰
  let divTag = '';
  if (pred && pred.diverge) divTag = '<span class="diff-tag warn" title="Elo/DC/市场方向不一致">⚠️分歧</span>';
  // 反向信号:模型明显比市场更不看好某方向(负 edge)→ 提示不碰
  let revTag = '';
  if (pred && pred.reversePicks && pred.reversePicks.length) {
    const rp = pred.reversePicks.map(r => r.label + ' 模型' + Math.round(r.modelProb * 100) + '%/盘口' + Math.round(r.oddsProb * 100) + '%').join('、');
    revTag = '<span class="diff-tag warn" title="模型 vs 市场对立(' + rp + ')">⚠️反向</span>';
  }
  // 临场情报:消息面核心缺阵预警(伤停/停赛信号强时)
  let injTag = '';
  if (pred && pred.msgSignals) {
    const ms = pred.msgSignals;
    const inj = [];
    if (ms.home != null && ms.home <= -0.15) inj.push(cnTeam(homeName) + '缺阵信号' + ms.home.toFixed(2));
    if (ms.away != null && ms.away <= -0.15) inj.push(cnTeam(awayName) + '缺阵信号' + ms.away.toFixed(2));
    if (inj.length) injTag = '<span class="diff-tag warn" title="消息面伤停/停赛信号:' + inj.join(';') + '">⚠️核心缺阵</span>';
  }
  // 赛程风险:周中 / 3 天内双赛
  let riskTags = '';
  try {
    const bjDay = new Date(m.utcDate).getUTCDay();
    const isMidweek = [2, 3, 4].includes(bjDay);
    const mk = (n) => normTeam(n);
    const myTeams = [mk(m.homeTeam?.name || ''), mk(m.awayTeam?.name || '')];
    const near = (state.fixtures || []).filter(f => {
      if (!f.homeTeam?.name || !f.awayTeam?.name || !f.utcDate) return false;
      if (f.utcDate === m.utcDate) return false;
      const ft = [mk(f.homeTeam.name), mk(f.awayTeam.name)];
      if (!myTeams.some(x => x && ft.includes(x))) return false;
      const diff = Math.abs(new Date(f.utcDate).getTime() - new Date(m.utcDate).getTime());
      return diff > 0 && diff < 3 * 86400000;
    });
    const tags = [];
    if (isMidweek) tags.push('<span class="diff-tag warn">⚡周中</span>');
    if (near.length) tags.push('<span class="diff-tag warn">⏱️密集赛程</span>');
    riskTags = tags.join('');
  } catch (e) {}
  return `<div class="match-card" onclick="openDetail('${esc(homeName).replace(/'/g, '')}','${esc(awayName).replace(/'/g, '')}','${m.competition?.code || ''}')">
    <div class="mc-time"><div class="t">${score.text === 'VS' ? fmtTime(m.utcDate) : score.text}</div><div class="d">${score.statusText || (m.competition?.code === 'CL' ? '欧冠' : '')}</div></div>
    <div class="mc-teams">
      <div class="mc-team">${m.homeTeam?.crest ? `<img src="${m.homeTeam.crest}" alt="${esc(cnTeam(homeName))} 队徽" onerror="this.style.display='none'">` : ''}<span class="cn">${cnTeam(homeName)}</span></div>
      <div class="mc-team">${m.awayTeam?.crest ? `<img src="${m.awayTeam.crest}" alt="${esc(cnTeam(awayName))} 队徽" onerror="this.style.display='none'">` : ''}<span class="cn">${cnTeam(awayName)}</span></div>
    </div>
    <div class="mc-score ${score.cls}"><div class="s">${score.text === 'VS' ? 'VS' : score.text}</div>${score.statusText && score.statusText !== 'VS' ? `<div class="st">${score.statusText}</div>` : ''}</div>
    ${pred && pred.signalLevel !== 'none' ? `<div class="mc-pred"><div class="ps">${pred.predictedScore}</div><div class="pc">预测 ${Math.round((pred.confidence||0)*100)}%</div></div>` : ''}
    ${(() => { const vp = (pred && pred.valuePicks && pred.valuePicks.length) ? pred.valuePicks[0] : null; return vp ? `<span class="val-tag" title="${vp.label}: 模型${Math.round(vp.modelProb*100)}% vs 盘口${Math.round(vp.oddsProb*100)}%">💰${vp.label} ${vp.edge > 0 ? '+' : ''}${Math.round(vp.edge*100)}%</span>` : ''; })()}
    ${pred && pred.signalLevel === 'gold' && pred.valuePicks?.length ? `<span class="val-tag gold">💰 ${pred.valuePicks.map(v => v.label).join('/')}</span>` : (pred && pred.signalLevel === 'watch' ? `<span class="val-tag watch">👀 关注</span>` : '')}
    ${hot || diff || value || divTag || revTag || injTag || riskTags ? `<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">${hot}${value}${diff}${divTag}${revTag}${injTag}${riskTags}</div>` : ''}
  </div>`;
}

function getScore(m) {
  const { score, status } = m;
  if (status === 'IN_PLAY' || status === 'LIVE' || status === 'PAUSED') {
    const ft = score?.fullTime || {};
    return { text: `${ft.home ?? '-'}-${ft.away ?? '-'}`, cls: 'live', statusText: status === 'PAUSED' ? '暂停' : '● 进行中' };
  }
  if (status === 'FINISHED') {
    const ft = score?.fullTime || {};
    return { text: `${ft.home ?? '-'}-${ft.away ?? '-'}`, cls: '', statusText: '完赛' };
  }
  if (status === 'POSTPONED') return { text: '延期', cls: '', statusText: '延期' };
  return { text: 'VS', cls: '', statusText: '' };
}

// ===== 积分榜 =====
function renderStandings() {
  const rows = state.standings[state.league];
  if (!rows || !rows.length) return `<div class="empty-state"><div class="icon">🏆</div>暂无积分榜数据(赛季开赛后自动更新)</div>`;
  return `<div class="table-wrap"><table class="standings">
    <thead><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进</th><th>失</th><th>净</th><th>积分</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr>
      <td class="pos ${i < 4 ? 'top4' : ''}">${r.position}</td>
      <td class="team">${cnTeam(r.team)}<span class="en">${esc(r.team !== cnTeam(r.team) ? r.team : '')}</span></td>
      <td>${r.playedGames}</td><td>${r.won}</td><td>${r.draw}</td><td>${r.lost}</td>
      <td>${r.goalsFor}</td><td>${r.goalsAgainst}</td><td>${r.goalDifference > 0 ? '+' : ''}${r.goalDifference}</td>
      <td class="pts">${r.points}</td>
    </tr>`).join('')}</tbody>
  </table></div>
  <div class="xg-note">数据来源:Football-Data.org 官方积分榜(每日更新)</div>`;
}

// ===== 预测战绩 =====
function renderCalibration() {
  // 校准报告:2025/26 赛季 Elo 滚动回测的分组命中率
  const c = state.calibration;
  if (!c || !c.buckets) return '';
  const cls = b => b.bias > 0.01 ? 'up' : (b.bias < -0.01 ? 'down' : '');
  const note = b => b.bias > 0.01 ? '低估' : (b.bias < -0.01 ? '偏乐观' : '校准良好');
  return `<div class="calib-card">
    <div class="section-title" style="margin-top:0">📐 模型校准(${c.source || '上赛季回测'} · ${c.total} 场)</div>
    <div style="font-size:12px;color:var(--text-2);margin-bottom:8px">总命中率 <b style="color:var(--gold)">${(c.overall * 100).toFixed(1)}%</b>(胜负方向)· 方向分布 主胜${c.directionDist?.home || 0} / 客胜${c.directionDist?.away || 0}</div>
    <div class="table-wrap"><table class="standings" style="min-width:420px">
      <thead><tr><th>模型概率区间</th><th style="text-align:right">场次</th><th style="text-align:right">实际命中</th><th style="text-align:right">平均概率</th><th style="text-align:right">偏差</th><th>解读</th></tr></thead>
      <tbody>${c.buckets.map(b => `<tr>
        <td>${b.label}</td><td style="text-align:right">${b.n}</td>
        <td style="text-align:right;font-weight:700">${(b.hitRate * 100).toFixed(1)}%</td>
        <td style="text-align:right">${(b.avgProb * 100).toFixed(1)}%</td>
        <td class="${cls(b)}" style="text-align:right">${b.bias > 0 ? '+' : ''}${(b.bias * 100).toFixed(1)}%</td>
        <td style="font-size:11px;color:var(--muted)">${note(b)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">解读:命中率 ≈ 平均概率 = 校准良好;偏差为负表示模型偏乐观(高估),下注时建议对应降注。55-65% 区间最可信,≥65% 的"高置信"历史命中约 69%,凯利注码建议打 8 折。</div>
  </div>`;
}

function renderCalibOu() {
  // 盘口模型校准:大球/让球概率分组命中率(验证 ou/sp edge 可信度)
  const c = state.calibOu;
  if (!c) return '';
  const secHtml = (sec, name) => `<div class="section-title" style="margin-top:12px">${name}(整体 ${(sec.overall * 100).toFixed(1)}%)</div>
    <div class="table-wrap"><table class="standings" style="min-width:420px">
      <thead><tr><th>模型概率区间</th><th style="text-align:right">场次</th><th style="text-align:right">实际命中</th><th style="text-align:right">模型概率</th><th style="text-align:right">偏差</th><th>解读</th></tr></thead>
      <tbody>${sec.buckets.map(b => `<tr><td>${b.label}</td><td style="text-align:right">${b.n}</td><td style="text-align:right;font-weight:700">${(b.hitRate * 100).toFixed(1)}%</td><td style="text-align:right">${(b.avgProb * 100).toFixed(1)}%</td><td class="${b.bias > 0.01 ? 'up' : (b.bias < -0.01 ? 'down' : '')}" style="text-align:right">${b.bias > 0 ? '+' : ''}${(b.bias * 100).toFixed(1)}%</td><td style="font-size:11px;color:var(--muted)">${b.bias > 0.01 ? '低估' : (b.bias < -0.01 ? '高估' : '校准良好')}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="calib-card" style="margin-top:14px">
    <div class="section-title" style="margin-top:0">🎯 盘口模型校准(${c.source} · ${c.total} 场)</div>
    ${secHtml(c.ou25, '大球 >2.5 球')}${secHtml(c.ah05, '主队 -0.5 让球盘')}${secHtml(c.ah15, '主队 -1.5 让球盘')}
    <div style="font-size:11px;color:var(--muted);margin-top:8px">解读:偏差为负 = 模型高估(该区间 edge 打 8 折);偏差为正 = 模型低估。大球概率注意均值回归:模型 &gt;60% 时实际约 50%,模型 &lt;45% 时实际反而更高--大球 edge 只在 50-60% 区间可信。</div>
  </div>`;
}

function renderRecord() {
  const h = state.history;
  const calibHtml = renderCalibration() + renderCalibOu();
  if (!h) return calibHtml || '<div class="empty-state"><div class="icon">📊</div>暂无战绩数据(预测结算后自动累积)</div>';
  const s = h.stats || {};
  const pct = v => (v == null ? '-' : Math.round(v * 100) + '%');
  const cards = [
    { k: '累计预测', v: s.total ?? 0 },
    { k: '已结算', v: s.finished ?? 0 },
    { k: '比分精确命中', v: pct(s.exactRate), cls: 'gold' },
    { k: '胜负方向命中', v: pct(s.outcomeRate), cls: s.outcomeRate >= 0.5 ? 'green' : 'red' },
    { k: '价值标记命中', v: pct(s.valueRate), cls: s.valueRate >= 0.5 ? 'green' : '' },
  ];
  // AI vs 统计模型方向命中对比(AI 研判有明确倾向的场次)
  const aiRow = (s.aiTotal > 0) ? '<div class="record-cards" style="margin-top:8px">' +
    '<div class="rec-card" style="border-color:var(--gold)"><div class="v gold">' + pct(s.aiRate) + '</div><div class="k">🤖 AI 方向命中(' + s.aiTotal + '场)</div></div>' +
    '<div class="rec-card"><div class="v">' + pct(s.outcomeRate) + '</div><div class="k">📊 模型方向命中(' + (s.finished || 0) + '场)</div></div>' +
    '<div class="rec-card"><div class="v">' + pct(s.aiExactRate) + '</div><div class="k">🤖 AI 比分精确</div></div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--muted);margin-bottom:4px">AI vs 模型同场对比:AI 有倾向场次方向命中 ' + pct(s.aiRate) + ' vs 全量模型 ' + pct(s.outcomeRate) + ' · 样本累积中,越多越可信</div>' : '';
  // 按盘口类型统计(模型方向 vs 实际)
  const mktRow = (s.ouTotal > 0 || s.spTotal > 0) ? '<div class="section-title" style="margin-top:14px">🎯 按盘口类型(模型方向 vs 实际)</div>' +
    '<div class="table-wrap"><table class="standings" style="min-width:400px">' +
    '<thead><tr><th>盘口类型</th><th style="text-align:right">场次</th><th style="text-align:right">命中</th><th style="text-align:right">命中率</th></tr></thead><tbody>' +
    '<tr><td>胜平负(方向)</td><td style="text-align:right">' + (s.finished || 0) + '</td><td style="text-align:right">' + (s.outcomeHit || 0) + '</td><td style="text-align:right;font-weight:700" class="' + (s.outcomeRate >= 0.5 ? 'up' : 'down') + '">' + pct(s.outcomeRate) + '</td></tr>' +
    '<tr><td>大小球(模型方向)</td><td style="text-align:right">' + (s.ouTotal || 0) + '</td><td style="text-align:right">' + (s.ouHit || 0) + '</td><td style="text-align:right;font-weight:700" class="' + ((s.ouRate || 0) >= 0.5 ? 'up' : 'down') + '">' + pct(s.ouRate) + '</td></tr>' +
    '<tr><td>让球(模型方向)</td><td style="text-align:right">' + (s.spTotal || 0) + '</td><td style="text-align:right">' + (s.spHit || 0) + '</td><td style="text-align:right;font-weight:700" class="' + ((s.spRate || 0) >= 0.5 ? 'up' : 'down') + '">' + pct(s.spRate) + '</td></tr>' +
    '</tbody></table></div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:6px">大小球 = 模型大/小球方向 vs 实际总进球;让球 = 模型主队赢盘方向 vs 实际净胜</div>' : '';
  // 按置信度区间统计(验证高置信是否真的更准)
  const cb = s.confBuckets || {};
  const cbRows = ['low', 'mid', 'high'].filter(k => cb[k] && cb[k].n > 0).map(k => {
    const name = { low: '低置信 <50%', mid: '中置信 50-65%', high: '高置信 ≥65%' }[k];
    const b = cb[k];
    return '<tr><td>' + name + '</td><td style="text-align:right">' + b.n + '</td><td style="text-align:right">' + pct(b.rate) + '</td><td style="text-align:right">' + pct(b.avgConf) + '</td><td class="' + (b.rate >= b.avgConf - 0.02 ? 'up' : 'down') + '" style="text-align:right">' + (b.rate >= b.avgConf - 0.02 ? '符合预期' : '偏乐观') + '</td></tr>';
  }).join('');
  const confRow = (s.finished > 0 && cbRows) ? '<div class="section-title" style="margin-top:14px">📐 按置信度区间(验证校准)</div>' +
    '<div class="table-wrap"><table class="standings" style="min-width:420px">' +
    '<thead><tr><th>区间</th><th style="text-align:right">场次</th><th style="text-align:right">实际命中</th><th style="text-align:right">平均置信</th><th>校准判断</th></tr></thead><tbody>' + cbRows + '</tbody></table></div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:6px">实际命中 ≥ 平均置信 = 校准良好;实际命中 < 平均置信 = 模型偏乐观(高置信该打折)</div>' : '';
   // ROI 盈亏:按价值信号推荐(方向+当时欧赔+凯利注额,注额上限 5%)统一结算
   const roiCls = s.betPnl > 0 ? 'green' : (s.betPnl < 0 ? 'red' : '');
   const roiRow = (s.betSettled > 0) ? '<div class="record-cards" style="margin-top:8px;border:1px solid var(--border);border-radius:12px;padding:6px">' +
     '<div class="rec-card"><div class="v ' + roiCls + '">' + (s.betPnl > 0 ? '+' : '') + (s.betPnl || 0).toFixed(2) + '</div><div class="k">💰 累计盈亏(基准注额)</div></div>' +
     '<div class="rec-card"><div class="v ' + roiCls + '">' + (s.betROI > 0 ? '+' : '') + ((s.betROI || 0) * 100).toFixed(1) + '%</div><div class="k">📈 ROI(' + s.betSettled + '场)</div></div>' +
     '<div class="rec-card"><div class="v ' + (s.betRate >= 0.5 ? 'green' : 'red') + '">' + pct(s.betRate) + '</div><div class="k">🎯 推荐方向胜率(' + s.betWon + '/' + s.betSettled + ')</div></div>' +
     '<div class="rec-card"><div class="v">' + (s.betStakeTotal || 0).toFixed(2) + '</div><div class="k">累计注额(基准)</div></div>' +
     '</div>' +
     '<div style="font-size:11px;color:var(--muted);margin-bottom:4px">ROI 按推荐场次统一基准注额结算:盈 = 注额×(赔率-1),亏 = 注额;注额 = 凯利分数(上限 5%)。ROI>0 = 按推荐下注有正期望</div>' : '';
   // 按盘口类型分别结算 ROI(h2h胜负 / spread让球 / score波胆)
   const mkLabel = { h2h: '胜负', spread: '让球', score: '波胆' };
   const mktBetRows = (s.betByMarket && Object.keys(s.betByMarket).length)
     ? Object.keys(s.betByMarket).map(mk => {
         const b = s.betByMarket[mk];
         const cls = b.pnl > 0 ? 'green' : (b.pnl < 0 ? 'red' : '');
         return '<div class="rec-card"><div class="v ' + cls + '">' + (b.pnl > 0 ? '+' : '') + b.pnl.toFixed(2) + ' · ' + (b.roi > 0 ? '+' : '') + (b.roi * 100).toFixed(1) + '%</div><div class="k">' + (mkLabel[mk] || mk) + '(' + b.n + '场/' + b.won + '胜)</div></div>';
       }).join('')
     : '';
   const mktBetRow = mktBetRows ? '<div class="record-cards" style="margin-top:8px;border:1px solid var(--border);border-radius:12px;padding:6px">' + mktBetRows + '</div>' : '';
  const rows = (h.results || []).slice().reverse().slice(0, 30).map(r => {
    const hit = r.hitOutcome;
    const aiHit = r.aiPick && r.aiPick !== 'none' ? r.aiHitOutcome : null;
    const br = r.betRec;
    const mkLb = { h2h: '胜负', spread: '让球', score: '波胆' };
    const brDesc = (br) => {
      const m = mkLb[br.market || 'h2h'] || '投注';
      if ((br.market || 'h2h') === 'score') return m + ' ' + br.side + ' @' + br.odds;
      if ((br.market || 'h2h') === 'spread') return m + ' 主' + (br.point == null ? '-' : (br.point > 0 ? '+' + br.point : br.point)) + '盘 @' + br.odds;
      const s = br.side;
      return m + ' ' + (s === 'home' ? '主胜' : s === 'away' ? '客胜' : s === 'draw' ? '平局' : s);
    };
    const pnlTag = (br && br.pnl != null) ? '<span class="' + (br.pnl > 0 ? 'res hit' : 'res miss') + '" style="margin-left:6px" title="推荐 ' + brDesc(br) + ' 注额' + ((br.stake || 0) * 100).toFixed(1) + '%">' + (br.pnl > 0 ? '+' : '') + (br.pnl * 100).toFixed(1) + '%</span>' : '';
    return '<div class="record-row"><div class="res ' + (hit ? 'hit' : 'miss') + '">' + (hit ? '✓' : '✗') + '</div>' +
      '<span style="flex:1">' + cnTeam(r.homeTeam) + ' vs ' + cnTeam(r.awayTeam) + '</span>' +
      '<span style="color:var(--muted);font-size:11px">预测</span> <span class="pred">' + (r.predictedScore || '-') + '</span>' +
      '<span style="color:var(--muted);font-size:11px">实际</span> <span class="actual">' + (r.actualScore || '-') + '</span>' +
      (aiHit == null ? '' : '<span class="res ' + (aiHit ? 'hit' : 'miss') + '" style="margin-left:6px" title="AI 研判:' + (r.aiScore || '-') + '">🤖' + (aiHit ? '✓' : '✗') + '</span>') +
      (r.hitOu == null ? '' : '<span class="res ' + (r.hitOu ? 'hit' : 'miss') + '" style="margin-left:6px;font-size:10px" title="大小球: 模型' + (r.ouModel?.over >= 0.5 ? '大' : '小') + (r.ouModel?.line || '') + '球">OU' + (r.hitOu ? '✓' : '✗') + '</span>') +
      (r.hitSp == null ? '' : '<span class="res ' + (r.hitSp ? 'hit' : 'miss') + '" style="margin-left:6px;font-size:10px" title="让球: 主' + (r.spModel?.point > 0 ? '+' + r.spModel?.point : r.spModel?.point) + '盘 模型' + (r.spModel?.cover >= 0.5 ? '主赢盘' : '客赢盘') + '">盘' + (r.hitSp ? '✓' : '✗') + '</span>') +
      '</div>';
  }).join('');
  return calibHtml +
  '<div class="record-cards">' + cards.map(c =>
    '<div class="rec-card"><div class="v ' + (c.cls || '') + '">' + c.v + '</div><div class="k">' + c.k + '</div></div>'
  ).join('') + '</div>' +
  mktRow +
  confRow +
  aiRow +

function trendSpark(values) {
  const vs = (values || []).filter(v => v != null);
  if (vs.length < 2) return '<div style="font-size:10px;color:var(--muted)">采样不足</div>';
  const w = 120, h = 28;
  const min = Math.min(...vs), max = Math.max(...vs);
  const span = (max - min) || 1;
  const pts = vs.map((v, i) => `${((i / (vs.length - 1)) * w).toFixed(1)},${(h - 3 - ((v - min) / span) * (h - 6)).toFixed(1)}`).join(' ');
  const down = vs[vs.length - 1] < vs[0];
  const color = down ? '#22c55e' : '#f59e0b';
  return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.85"/></svg>`;
}
function oddsTrendBlock(p) {
  // 初盘→临场走势:读 odds 文件的 history 快照序列
  const od = (p && p.league) ? state.oddsByLeague[p.league] : null;

  // 后端 odds_fetcher.py 只用 .lower() 生成键,不用 TEAM_ALIAS;前端匹配时保持一致
  const h = normTeam(p.homeTeam), a = normTeam(p.awayTeam);
  const hk = Object.keys(od.history).find(k => { const [x, y] = k.split('|'); return normTeam(x) === h && normTeam(y) === a; });
  if (!hk) return '';
  const snaps = od.history[hk];
  if (!snaps || snaps.length < 1) return '';
  const first = snaps[0], last = snaps[snaps.length - 1];
  const arrow = (x, y) => x != null && y != null ? (y > x ? '<span style="color:#f59e0b">↗' + (y - x).toFixed(2) + '</span>' : y < x ? '<span style="color:#22c55e">↘' + (x - y).toFixed(2) + '</span>' : '<span style="color:var(--muted)">平</span>') : '';
  const box = (k, label) => `<div class="trend-box"><div class="label">${label} ${arrow(first.h2h?.[k], last.h2h?.[k])}</div>${trendSpark(snaps.map(s => s.h2h?.[k]))}</div>`;
  return `<div class="section-title" style="margin-top:10px">📈 盘口走势(初盘→临场,${snaps.length} 次采样)</div>
    <div class="trend-row">${box('home', '主胜')}${box('draw', '平局')}${box('away', '客胜')}</div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px">初盘 ${first.h2h?.home ?? '-'} / ${first.h2h?.draw ?? '-'} / ${first.h2h?.away ?? '-'} → 临场 ${last.h2h?.home ?? '-'} / ${last.h2h?.draw ?? '-'} / ${last.h2h?.away ?? '-'} · 赔率降 = 资金看好</div>`;
}

    el.innerHTML = `<div class="section-title" style="margin-top:0">🎯 波胆分析（模型概率）</div>
    <div class="cs-grid">${items}</div>` +
      (() => { const big = cs.filter(c => { const [h, a] = c.score.split('-').map(Number); return h >= 3 || a >= 3; }); if (!big.length) return ''; const top = big[0]; return '<div style="font-size:10.5px;color:var(--gold);margin-top:8px;padding:6px 8px;border-radius:6px;background:rgba(240,185,11,.08);border:1px solid rgba(240,185,11,.2)">🎯 若爆大比分,最可能 <b>' + top.score + '</b> (' + pct(top.prob) + ')</div>'; })();
  }
}

// ── 刷新(合并:右上角一键 = 本地重载 + 云端触发 + 自动轮询)──
// 详情页原「刷新分析」已移除:云端刷新状态统一显示在右上角刷新按钮旁。
function refreshAll() {
  const status = $('refreshStatus');
  const pat = localStorage.getItem('gh_pat');
  // 1 有 Token 则触发云端 Actions 重抓(不等待本地加载)
  if (pat) {
    fetch('https://api.github.com/repos/BarryLiu-agent/football-guide/actions/workflows/daily.yml/dispatches', {
      method: 'POST',
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + pat, 'X-GitHub-Api-Version': '2022-11-28' },
      body: JSON.stringify({ ref: 'main' })
    }).then(r => {
      if (r.ok) status.textContent = '云端刷新已触发,约 2-4 分钟自动更新...';
      else if (r.status === 401 || r.status === 403) {
        localStorage.removeItem('gh_pat');
        status.innerHTML = 'Token 无效,已清除 · <a href="#" onclick="event.preventDefault();configToken()" style="color:var(--gold)">重新配置</a>';
      } else status.textContent = '触发失败(HTTP ' + r.status + '),30 分钟内自动更新。';
    }).catch(() => status.textContent = '网络错误,30 分钟内自动更新。');
    startPoll();
  }
  // 2 立即重载现有数据并渲染(本地 / GitHub Pages 都是重新拉取 data/*.json)
  loadAll().then(() => {
    loadStatus();  // 状态抽屉数据一并刷新
    render();
    lastVersion = DATA_VERSION;
    if (currentPred) syncDetail();
    if (!pat) {
      status.innerHTML = '已刷新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + ' · <a href="#" onclick="event.preventDefault();configToken()" style="color:var(--gold)">配置云端 Token</a>';
    } else {
      status.textContent = '已刷新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '(云端刷新中)';
    }
  });
}

function configToken() {
  const status = $('refreshStatus');
  status.innerHTML = '需 GitHub Token:<a href="https://github.com/settings/tokens/new?type=classic&description=kun-refresh&scopes=workflow" target="_blank" style="color:var(--gold)">点此创建</a> 后粘贴:';
  const input = document.createElement('input');
  input.type = 'password'; input.placeholder = 'ghp_...';
  input.style.cssText = 'width:150px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--text);font-size:11px;';
  const btn = document.createElement('button');
  btn.textContent = '保存'; btn.className = 'btn'; btn.style.cssText = 'padding:4px 10px;font-size:11px;';
  btn.onclick = () => { const v = input.value.trim(); if (!v) return; localStorage.setItem('gh_pat', v); refreshAll(); };
  status.appendChild(input); status.appendChild(btn);
}

function startPoll() {
  // 轮询检测云端数据版本是否更新（只拉 ~90B 的 version.json，不拉大文件）
  // CI 写回是原子提交：version.json 与数据文件同批变化 → 版本变 = 数据变
  if (pollTimer) clearInterval(pollTimer);
  const start = Date.now();
  pollTimer = setInterval(async () => {
    try {
      const v = await loadJson('data/version.json');
      if (lastVersion && v.version && v.version !== lastVersion) {
        clearInterval(pollTimer); pollTimer = null;
        lastVersion = v.version;
        $('refreshStatus').textContent = '✅ 云端数据已更新';
        loadAll().then(() => { render(); if (currentPred) syncDetail(); });
      } else if (!lastVersion) {
        lastVersion = v.version;
      } else if (Date.now() - start > 5 * 60000) {
        clearInterval(pollTimer); pollTimer = null;
        $('refreshStatus').textContent = '云端刷新完成(数据未变化)';
      }
    } catch (e) {}
  }, 20000);
}

function syncDetail() {
  // 详情弹窗打开时同步最新分析:重建整个弹窗(aiSection+盘口+分析+交锋全量刷新)
  const fresh = state.predictions.find(p => p.homeTeam === currentPred.homeTeam && p.awayTeam === currentPred.awayTeam && p.league === currentPred.league);
  if (fresh) { currentPred = fresh; openDetail(fresh.homeTeam, fresh.awayTeam, fresh.league); }
}

// ===== Init =====
loadAll().then(render);

// ===== 页脚数据状态简版 =====
(function initFooter() {
  const foot = document.createElement('div');
  foot.className = 'footer-status';
  foot.id = 'footerStatus';
  foot.textContent = '数据更新时间加载中...';
  document.body.appendChild(foot);
})();
</script>
