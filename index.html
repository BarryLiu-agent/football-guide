<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>赌狗赌到最后应有尽有</title>
<style>
/* ===== Design Tokens ===== */
:root {
  --bg: #0b0e14;
  --bg-2: #11151d;
  --surface: #171c26;
  --surface-2: #1d2330;
  --border: #262d3b;
  --border-light: #333c4d;
  --text: #e8ecf2;
  --text-2: #9aa5b5;
  --text-3: #6b7686;
  --gold: #f0b90b;
  --gold-dim: #b8860b;
  --green: #16c784;
  --green-bg: rgba(22, 199, 132, 0.12);
  --red: #ea3943;
  --red-bg: rgba(234, 57, 67, 0.12);
  --blue: #3b82f6;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-color: var(--border-light) var(--bg); }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { display: block; }

/* ===== Header ===== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11, 14, 20, 0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1200px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 16px;
}
.logo { font-size: 17px; font-weight: 800; letter-spacing: 0.02em; }
.logo .accent { color: var(--gold); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.header-time { font-size: 11px; color: var(--text-3); }
.btn-refresh {
  font-size: 12px; padding: 6px 12px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); transition: all .15s;
}
.btn-refresh:hover { border-color: var(--gold); color: var(--gold); }
.btn-refresh:active { transform: scale(0.96); }

/* ===== League Nav ===== */
.league-nav {
  display: flex; gap: 8px; overflow-x: auto;
  max-width: 1200px; margin: 0 auto; padding: 12px 20px 0;
}
.league-nav::-webkit-scrollbar { height: 0; }
.lg-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px 10px 0 0;
  background: var(--bg-2); border: 1px solid var(--border); border-bottom: none;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: all .15s; white-space: nowrap;
}
.lg-btn .lg-badge {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; color: #fff;
}
.lg-btn:hover { color: var(--text); background: var(--surface); }
.lg-btn.active { background: var(--surface); color: var(--text); border-color: var(--border-light); }
.lg-btn.active .lg-badge { box-shadow: 0 0 0 2px var(--gold-dim); }

/* ===== Sub Nav (4 sections) ===== */
.sub-nav {
  display: flex; gap: 4px; max-width: 1200px; margin: 0 auto; padding: 0 20px;
  border-bottom: 1px solid var(--border);
}
.sub-btn {
  padding: 8px 14px; font-size: 12.5px; font-weight: 500; color: var(--text-3);
  border-bottom: 2px solid transparent; transition: all .15s;
}
.sub-btn:hover { color: var(--text); }
.sub-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ===== Main ===== */
.main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 60px; }

/* ===== Match Card ===== */
.match-list { display: flex; flex-direction: column; gap: 8px; }
.match-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; gap: 14px;
  transition: all .15s; cursor: pointer;
}
.match-card:hover { border-color: var(--border-light); transform: translateY(-1px); box-shadow: var(--shadow); }
.mc-time { min-width: 52px; text-align: center; }
.mc-time .t { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mc-time .d { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.mc-league {
  min-width: 44px; text-align: center;
  font-size: 10px; font-weight: 700; color: var(--text-2);
  padding: 3px 6px; border-radius: 6px; background: var(--bg-2);
  border: 1px solid var(--border);
}
.mc-teams { flex: 1; min-width: 0; }
.mc-team {
  display: flex; align-items: center; gap: 8px; padding: 2px 0;
  font-size: 13.5px; font-weight: 500;
}
.mc-team .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-team .en {
  font-size: 11px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mc-team img {
  width: 22px; height: 22px; object-fit: contain; flex-shrink: 0;
  background: #fff; border-radius: 50%; padding: 2px;
}
.mc-score { min-width: 64px; text-align: center; }
.mc-score .s { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mc-score .st { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.mc-score.live .s { color: var(--red); }
.mc-score.live .st { color: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.mc-pred {
  min-width: 64px; text-align: center; padding: 6px 10px;
  border-radius: 10px; background: var(--green-bg);
  border: 1px solid rgba(22, 199, 132, 0.3);
}
.mc-pred .ps { font-size: 15px; font-weight: 800; color: var(--green); }
.mc-pred .pc { font-size: 10px; color: var(--text-2); margin-top: 1px; }
.mc-badge-jc {
  font-size: 10px; padding: 3px 6px; border-radius: 6px;
  background: var(--gold-dim); color: #fff; font-weight: 700;
}
.mc-alert {
  font-size: 10px; padding: 3px 6px; border-radius: 6px;
  background: var(--red-bg); color: var(--red); font-weight: 700;
  border: 1px solid rgba(234, 57, 67, 0.35);
}

/* ===== Date Group ===== */
.date-group { margin-bottom: 18px; }
.date-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; color: var(--text-2);
  margin-bottom: 10px; letter-spacing: 0.03em;
}
.date-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.date-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.date-label.is-today { color: var(--gold); }
.date-label.is-today .dot { background: var(--gold); box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.15); }
.date-label.is-tomorrow .dot { background: var(--blue); }
.date-label .count { font-size: 10px; color: var(--text-3); font-weight: 400; }

/* 无价值信号场次：默认折叠，减少无效出手干扰 */
.no-signal { margin-top: 2px; }
.no-signal summary {
  cursor: pointer; list-style: none; font-size: 11px; color: var(--text-3);
  padding: 6px 10px; border-radius: 8px; background: var(--bg-2);
  display: inline-flex; align-items: center; gap: 6px; user-select: none;
}
.no-signal summary:hover { color: var(--text-2); }
.no-signal summary::before { content: '▸'; transition: transform .15s; }
.no-signal[open] summary::before { transform: rotate(90deg); }
.no-signal .match-list.dim { opacity: .55; filter: saturate(.6); }
.no-signal .match-list.dim .match-card { box-shadow: none; border-color: var(--border); }

/* 盘口走势（初盘→临场） */
.calib-card {
  padding: 12px 14px; border-radius: var(--radius); margin-bottom: 14px;
  background: linear-gradient(180deg, rgba(240,185,11,.06), rgba(240,185,11,.02));
  border: 1px solid rgba(240,185,11,.22);
}
.trend-row { display: flex; gap: 10px; flex-wrap: wrap; }
.trend-box {
  flex: 1; min-width: 110px; padding: 8px 10px; border-radius: var(--radius);
  background: var(--bg-2); border: 1px solid var(--border);
}
.trend-box .label { font-size: 11px; color: var(--text-2); margin-bottom: 4px; display: flex; justify-content: space-between; }
.trend-box svg { margin: 0 auto; }

/* ===== Standing Table ===== */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.standings { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
table.standings th {
  text-align: left; padding: 10px 12px; font-size: 11px; color: var(--text-3);
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
}
table.standings td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
table.standings tr:last-child td { border-bottom: none; }
table.standings tbody tr:hover { background: var(--surface-2); }
table.standings .pos { font-weight: 700; width: 36px; color: var(--text-2); }
table.standings .pos.top4 { color: var(--blue); }
table.standings .pos.releg { color: var(--red); }
table.standings .team { font-weight: 600; }
table.standings .team .en { color: var(--text-3); font-weight: 400; font-size: 11px; margin-left: 6px; }
table.standings .pts { font-weight: 800; color: var(--gold); }
table.standings .xg-pos { color: var(--text-3); }
table.standings .up { color: var(--green); }
table.standings .down { color: var(--red); }

/* ===== Filters ===== */
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  font-size: 12px; padding: 5px 12px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
  transition: all .15s;
}
.chip:hover { border-color: var(--border-light); color: var(--text); }
.chip.active { background: var(--gold); color: #0b0e14; font-weight: 700; border-color: var(--gold); }

.value-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(240,185,11,.15); color:var(--gold); border:1px solid rgba(240,185,11,.4); animation: pulse 1.5s infinite; }
.xg-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(59,130,246,.15); color:#60a5fa; border:1px solid rgba(59,130,246,.35); }
.xg-tag.diverging { background:rgba(234,57,67,.15); color:#f87171; border-color:rgba(234,57,67,.45); }
.val-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; display:inline-block; }
.val-tag.gold { background:rgba(240,185,11,.15); color:#fbbf24; border:1px solid rgba(240,185,11,.5); }
.val-tag.watch { background:rgba(148,163,184,.12); color:#94a3b8; border:1px solid rgba(148,163,184,.35); }
.rec-chip { font-size:11px; padding:3px 10px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text-2); display:inline-flex; align-items:center; gap:4px; }
.rec-chip.gold { color:#fbbf24; border-color:rgba(240,185,11,.4); }
.stale-banner { padding:8px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; background:rgba(234,57,67,.1); color:#f87171; border:1px solid rgba(234,57,67,.3); }

.val-tag { font-size:10px; font-weight:800; padding:2px 8px; border-radius:10px; background:rgba(240,185,11,.15); color:var(--gold); border:1px solid rgba(240,185,11,.45); }

/* ===== 异动/难度标签 ===== */
.hot-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.4); }
.diff-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
.diff-tag.hard { background:rgba(239,68,68,.12); color:#f87171; }
.diff-tag.mid { background:rgba(245,158,11,.12); color:#fbbf24; }
.diff-tag.easy { background:rgba(34,197,94,.12); color:#4ade80; }
.diff-tag.warn { background:rgba(168,85,247,.14); color:#c084fc; }

.xg-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(59,130,246,.15); color:#60a5fa; border:1px solid rgba(59,130,246,.35); }
.val-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; display:inline-block; }
.val-tag.gold { background:rgba(240,185,11,.15); color:#fbbf24; border:1px solid rgba(240,185,11,.5); }
.val-tag.watch { background:rgba(148,163,184,.12); color:#94a3b8; border:1px solid rgba(148,163,184,.35); }
.rec-chip { font-size:11px; padding:3px 10px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text-2); display:inline-flex; align-items:center; gap:4px; }
.rec-chip.gold { color:#fbbf24; border-color:rgba(240,185,11,.4); }
.stale-banner { padding:8px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; background:rgba(234,57,67,.1); color:#f87171; border:1px solid rgba(234,57,67,.3); }

/* ===== 异动/难度标签 ===== */
.hot-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.4); }
.diff-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
.diff-tag.hard { background:rgba(239,68,68,.12); color:#f87171; }
.diff-tag.mid { background:rgba(245,158,11,.12); color:#fbbf24; }
.diff-tag.easy { background:rgba(34,197,94,.12); color:#4ade80; }
.diff-tag.warn { background:rgba(168,85,247,.14); color:#c084fc; }

/* ===== Detail Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: none; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border-light);
  border-radius: 16px; max-width: 720px; width: 100%;
  box-shadow: var(--shadow-lg); animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 30px; height: 30px; border-radius: 8px; font-size: 18px;
  background: var(--bg-2); color: var(--text-2); display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 18px 22px; }

/* Market tabs */
.mkt-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.mkt-tab {
  font-size: 12px; padding: 6px 12px; border-radius: 8px;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2);
}
.mkt-tab.active { background: var(--gold); color: #0b0e14; font-weight: 700; border-color: var(--gold); }
.odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.odds-box {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; text-align: center;
}
.odds-box .label { font-size: 11px; color: var(--text-3); }
.odds-box .value { font-size: 18px; font-weight: 800; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.odds-box .value.hot { color: var(--gold); }
.odds-box .sub { font-size: 10.5px; color: var(--text-2); }
.odds-box .diff { font-size: 10.5px; font-weight: 600; }
.odds-box .diff.up { color: var(--red); }
.odds-box .diff.down { color: var(--green); }
.odds-box .diff.flat { color: var(--text-3); }
.cs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.cs-item {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px; text-align: center;
}
.cs-item .score { font-weight: 800; font-size: 14px; }
.cs-item .p { font-size: 11px; color: var(--text-2); }
.section-title {
  font-size: 12px; font-weight: 700; color: var(--text-2);
  margin: 16px 0 8px; display: flex; align-items: center; gap: 6px;
}
.analysis-box {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; font-size: 12.5px; line-height: 1.8;
  white-space: pre-wrap; color: var(--text);
}
.analysis-box .hl { color: var(--gold); font-weight: 600; }
.analysis-actions { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; }
.btn {
  font-size: 12.5px; padding: 7px 14px; border-radius: 8px;
  background: var(--gold); color: #0b0e14; font-weight: 700; transition: all .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-weight: 500; }
.refresh-note { font-size: 11px; color: var(--text-2); flex: 1; }

/* Stats (record) */
.record-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
.rec-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; text-align: center;
}
.rec-card .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rec-card .v.gold { color: var(--gold); }
.rec-card .v.green { color: var(--green); }
.rec-card .v.red { color: var(--red); }
.rec-card .k { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.record-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; font-size: 12.5px;
}
.record-row .res {
  font-size: 16px; width: 22px; text-align: center;
}
.record-row .hit { color: var(--green); }
.record-row .miss { color: var(--red); }
.record-row .pred { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.record-row .actual { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Empty / loading */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text-3);
  border: 1px dashed var(--border); border-radius: var(--radius);
}
.empty-state .icon { font-size: 32px; margin-bottom: 10px; }
.spinner {
  width: 28px; height: 28px; border: 3px solid var(--border);
  border-top-color: var(--gold); border-radius: 50%;
  animation: spin .8s linear infinite; margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Scorer / xG lists ===== */
.xg-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 6px;
}
.xg-row .rank { width: 28px; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; }
.xg-row .name { flex: 1; font-weight: 600; }
.xg-row .val { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.xg-row .bar-wrap { flex: 1; height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
.xg-row .bar { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 3px; }
.xg-note { font-size: 11px; color: var(--text-3); margin: 10px 0; text-align: center; }

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .header-inner { padding: 10px 14px; }
  .main { padding: 12px 14px 50px; }
  .match-card { padding: 10px 12px; gap: 10px; }
  .mc-time { min-width: 44px; }
  .mc-team { font-size: 12.5px; }
  .mc-team .en { display: none; }
  .mc-pred { min-width: 54px; padding: 5px 8px; }
  .modal { padding: 0; }
  .modal-header, .modal-body { padding: 14px 16px; }
  .odds-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="header">
  <div class="header-inner">
    <div class="logo">🎲 赌狗赌到<span class="accent">最后应有尽有</span></div>
    <div class="header-right">
      <span class="header-time" id="lastUpdated"></span>
      <button class="btn-refresh" onclick="refreshAll()">🔄 刷新</button>
      <span class="refresh-note" id="refreshStatus" style="display:inline-block;max-width:300px;vertical-align:middle"></span>
    </div>
  </div>
  <!-- League Nav -->
  <nav class="league-nav" id="leagueNav"></nav>
  <!-- Sub Nav -->
  <nav class="sub-nav" id="subNav"></nav>
</header>

<main class="main">
  <div id="pageContent"></div>
</main>

<!-- ===== Detail Modal ===== -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body">
      <div class="mkt-tabs" id="mktTabs"></div>
      <div id="mktContent"></div>
      <div class="section-title">📝 数据分析</div>
      <div class="analysis-box" id="analysisBox"></div>
            <div id="xgBox"></div>
      <div id="h2hBox"></div>
    </div>
  </div>
</div>

<script>
// ===== 常量 =====
const LEAGUES = [
  { code: 'PL',  name: '英超', en: 'Premier League', color: '#3d195b', abbr: 'PL' },
  { code: 'PD',  name: '西甲', en: 'La Liga',        color: '#c9252e', abbr: 'PD' },
  { code: 'BL1', name: '德甲', en: 'Bundesliga',     color: '#d20515', abbr: 'BL1' },
  { code: 'SA',  name: '意甲', en: 'Serie A',        color: '#0a5c36', abbr: 'SA' },
  { code: 'FL1', name: '法甲', en: 'Ligue 1',        color: '#091c3e', abbr: 'FL1' },
  { code: 'CL',  name: '欧冠', en: 'Champions League', color: '#103f68', abbr: 'CL' },
];
const SUBS = [
  { id: 'fixtures', name: '📋 赛程赛果' },
  { id: 'standings', name: '🏆 积分榜' },
  { id: 'xg', name: '📈 xG 数据' },
  { id: 'scorers', name: '⚽ 射手榜' },
  { id: 'record', name: '📊 战绩' },
];
// Football-Data 赛程代码 ↔ 展示代码
const FD_CODE = { PL: 'PL', PD: 'PD', SA: 'SA', BL1: 'BL1', FL1: 'FL1', CL: 'CL' };
const COMPETITIONS = { PL: '英超', PD: '西甲', SA: '意甲', BL1: '德甲', FL1: '法甲', CL: '欧冠' };
const LEAGUE_CN = { PL: '英格兰超级联赛', PD: '西班牙甲级联赛', SA: '意大利甲级联赛', BL1: '德国甲级联赛', FL1: '法国甲级联赛', CL: '欧洲冠军联赛' };

// ===== 状态 =====
let state = {
  league: 'PL',
  sub: 'fixtures',
  fixtures: [],       // 全部赛程
  standings: {},      // 积分榜 {code: [...]}
  xg: {},             // xG {code: {...}}
  predictions: [],    // 预测
  predictionsMeta: null,
  jingcai: [],        // 竞彩
  xgMatches: [],      // 单场实时 xG
  history: null,      // 预测战绩
  teamNames: {},
  calibration: null,  // 模型校准报告
  oddsByLeague: {},   // 赔率 {code: {matches, history}}
  loaded: { fixtures: false, predictions: false },
};

// ===== 工具 =====
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 译名别名归一化（不同英文写法指向同一队）
const TEAM_ALIAS = {
  'bayern munchen': 'bayern', 'bayern munich': 'bayern',
  'internazionale milano': 'inter milan', 'inter milan': 'inter milan', 'inter': 'inter milan',
  'athletic club': 'athletic bilbao', 'athletic bilbao': 'athletic bilbao',
  'paris saint germain': 'psg', 'paris saint-germain': 'psg', 'psg': 'psg',
  'manchester united': 'man utd', 'manchester united fc': 'man utd', 'man utd': 'man utd',
  'manchester city': 'man city', 'manchester city fc': 'man city', 'man city': 'man city',
  'spartak moscow': 'spartak', 'cska moscow': 'cska',
  'stade rennais 1901': 'rennes', 'stade rennais': 'rennes', 'rennes': 'rennes',
};
function normTeam(s) {
  let n = (s || '').toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')  // ü->u, é->e
    .replace(/\b(fc|afc|cf|sc|ac)\b/g, '')
    .replace(/[-\u2013\u2014]/g, ' ')   // 连字符变空格（saint-germain -> saint germain）
    .replace(/[^a-z0-9 ]/g, '')
    .trim().replace(/\s+/g, ' ');
  return TEAM_ALIAS[n] || n;
}
// 队名匹配：精确 → 包含 → 末尾词（SV 07 Elversberg vs Elversberg）
function teamMatch(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  if (a.includes(b) || b.includes(a)) return true;
  const af = a.split(' '), bf = b.split(' ');
  return af[af.length - 1] === bf[bf.length - 1];
}
function cnTeam(name) {
  if (!name) return '?';
  const n = state.teamNames[name] || state.teamNames[name.replace(/\s+(FC|CF|SC|AFC)$/i, '')];
  return n || name;
}
function displayTeam(name) {
  const cn = cnTeam(name);
  return cn === name ? name : `${cn} <span class="en">${esc(name)}</span>`;
}
function fmtDate(utcStr) {
  const d = new Date(utcStr), bj = new Date(d.getTime() + 8 * 3600000);
  return `${bj.getUTCFullYear()}-${String(bj.getUTCMonth()+1).padStart(2,'0')}-${String(bj.getUTCDate()).padStart(2,'0')}`;
}
function fmtTime(utcStr) {
  const d = new Date(utcStr), bj = new Date(d.getTime() + 8 * 3600000);
  return `${String(bj.getUTCHours()).padStart(2,'0')}:${String(bj.getUTCMinutes()).padStart(2,'0')}`;
}
function todayBJ() {
  const bj = new Date(Date.now() + 8 * 3600000);
  return `${bj.getUTCFullYear()}-${String(bj.getUTCMonth()+1).padStart(2,'0')}-${String(bj.getUTCDate()).padStart(2,'0')}`;
}
function dateLabel(dateStr) {
  const t = todayBJ();
  const tm = fmtDate(new Date(Date.now() + 86400000).toISOString());
  if (dateStr === t) return '今天';
  if (dateStr === tm) return '明天';
  const d = new Date(dateStr + 'T00:00:00Z');
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return `${d.getUTCMonth()+1}月${d.getUTCDate()}日 ${days[d.getUTCDay()]}`;
}
function findPrediction(home, away, league) {
  const h = normTeam(home), a = normTeam(away);
  return (state.predictions || []).find(p =>
    (!league || p.league === league) &&
    teamMatch(normTeam(p.homeTeam), h) && teamMatch(normTeam(p.awayTeam), a));
}
function findXgMatch(home, away) {
  const h = normTeam(home), a = normTeam(away);
  return (state.xgMatches || []).find(m =>
    (normTeam(m.homeTeam) === h && normTeam(m.awayTeam) === a) ||
    (normTeam(m.homeTeam).split(' ')[0] === h.split(' ')[0] && normTeam(m.awayTeam).split(' ')[0] === a.split(' ')[0]));
}
function findJingcai(home, away, league) {
  const h = normTeam(home), a = normTeam(away);
  return (state.jingcai || []).find(m =>
    (!league || !m.leagueName || LEAGUE_CN[league] === m.leagueName || (m.leagueName || '').includes(COMPETITIONS[league] || '')) &&
    ((normTeam(m.homeTeam) === h && normTeam(m.awayTeam) === a) ||
     (normTeam(m.homeTeam).split(' ')[0] === h.split(' ')[0] && normTeam(m.awayTeam).split(' ')[0] === a.split(' ')[0])));
}

// ===== 数据加载 =====
async function loadJson(url) {
  const r = await fetch(url + '?t=' + Date.now());
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function loadAll() {
  const jobs = [
    loadJson('data/fixtures.json').then(d => { state.fixtures = d.matches || []; state.loaded.fixtures = true; }).catch(() => {}),
    loadJson('data/predictions.json').then(d => { state.predictions = d.predictions || []; state.predictionsMeta = d; state.loaded.predictions = true; }).catch(() => {}),
    loadJson('data/standings.json').then(d => { state.standings = d.standings || {}; }).catch(() => {}),
    loadJson('data/jingcai.json').then(d => { state.jingcai = d.matches || []; state.jingcaiGen = d.generatedAt || ''; }).catch(() => {}),
    loadJson('data/xg/matches.json').then(d => { state.xgMatches = d.matches || []; }).catch(() => {}),
    loadJson('data/prediction_history.json').then(d => { state.history = d; }).catch(() => {}),
    loadJson('data/calibration.json').then(d => { state.calibration = d; }).catch(() => {}),
    loadJson('data/calibration_ou.json').then(d => { state.calibOu = d; }).catch(() => {}),
    loadJson('data/team_names.json').then(d => { state.teamNames = d; }).catch(() => {}),
  ];
  // xG 逐个联赛加载（可能不存在）
  for (const lg of LEAGUES) {
    jobs.push(loadJson(`data/xg/${lg.code}.json`).then(d => { state.xg[lg.code] = d; }).catch(() => {}));
  }
  // 赔率快照（含初盘→临场 history）逐个联赛加载
  for (const lg of LEAGUES) {
    jobs.push(loadJson(`data/odds/${lg.code}.json`).then(d => { state.oddsByLeague[lg.code] = d; }).catch(() => {}));
  }
  await Promise.all(jobs);
  const d = state.history?.stats;
  const gen = state.predictionsMeta?.generatedAt;
  if (gen) $('lastUpdated').textContent = '数据 ' + gen.slice(5, 16).replace('T', ' ');
  // 竞彩新鲜度提示（本地每小时推送；>2 小时未更新 = 电脑未运行/脚本停了）
  if (state.jingcaiGen) {
    const jcAge = Date.now() - new Date(state.jingcaiGen).getTime();
    if (jcAge > 2 * 3600000) {
      const h = Math.floor(jcAge / 3600000);
      const el = $('pageContent');
      if (el && !el.querySelector('.jc-stale')) {
        el.insertAdjacentHTML('afterbegin', '<div class="stale-banner jc-stale" style="background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35)">⚠️ 竞彩数据 ' + h + ' 小时前更新（本地电脑计划任务未运行，电脑关机？）。其余数据由云端自动更新不受影响。</div>');
      }
    }
  }
  // 数据过期提示（>12 小时）
  if (gen) {
    const age = Date.now() - new Date(gen).getTime();
    if (age > 12 * 3600000) {
      const el = $('pageContent');
      if (el && !el.querySelector('.stale-banner')) {
        el.insertAdjacentHTML('afterbegin', '<div class="stale-banner">⚠️ 数据已超过 12 小时未更新（' + gen.slice(0, 16).replace('T', ' ') + ' UTC）。每日 10:00 自动更新，也可点右上角刷新。</div>');
      }
    }
  }
  renderNav();
  render();
}

// ===== 导航渲染 =====
function renderNav() {
  $('leagueNav').innerHTML = LEAGUES.map(l =>
    `<button class="lg-btn ${state.league === l.code ? 'active' : ''}" onclick="selectLeague('${l.code}')">
       <span class="lg-badge" style="background:${l.color}">${l.abbr}</span>${l.name}
     </button>`).join('');
  $('subNav').innerHTML = SUBS.map(s =>
    `<button class="sub-btn ${state.sub === s.id ? 'active' : ''}" onclick="selectSub('${s.id}')">${s.name}</button>`).join('');
}
function selectLeague(code) { state.league = code; state.sub = 'fixtures'; renderNav(); render(); }
function selectSub(sub) { state.sub = sub; renderNav(); render(); }

// ===== 渲染 =====
function render() {
  const el = $('pageContent');
  const lg = LEAGUES.find(l => l.code === state.league);
  if (!lg) return;
  const header = `<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;">
    <h2 style="font-size:19px;">${lg.name}</h2>
    <span style="font-size:11px;color:var(--text-3);">${lg.en}</span>
  </div>
  ${state.sub === 'fixtures' ? renderTopBar(lg.code) : ''}`;
  const body = state.sub === 'fixtures' ? renderFixtures() :
               state.sub === 'standings' ? renderStandings() :
               state.sub === 'xg' ? renderXg() :
               state.sub === 'record' ? renderRecord() : renderScorers();
  el.innerHTML = header + body;
}

// ===== 顶部信息栏：模型校准 + 今日精选 =====
function renderTopBar(leagueCode) {
  const mi = state.predictionsMeta || {};
  const stats = state.history?.stats;
  const calib = mi.modelInfo || {};
  const season = calib.season || {};
  const started = season.seasonStarted ? '赛季第' + (season.round || '?') + '轮' : '休赛期（未校准）';
  // 今日精选：黄金信号 + 今天/明天
  const t = todayBJ(), tm = fmtDate(new Date(Date.now() + 86400000).toISOString());
  const picks = (state.predictions || []).filter(p =>
    p.league === leagueCode && p.signalLevel === 'gold' &&
    (fmtDate(p.kickoff) === t || fmtDate(p.kickoff) === tm)).slice(0, 3);
  let picksHtml = '';
  if (picks.length) {
    picksHtml = '<div style="margin-bottom:12px"><div class="section-title" style="margin-bottom:8px">⭐ 今日精选</div>' +
      picks.map(p => {
        const vp = (p.valuePicks || [])[0];
        return `<div class="match-card" onclick="openDetail('${esc(p.homeTeam)}','${esc(p.awayTeam)}')">` +
          '<div class="mc-teams"><div class="mc-team"><span class="cn">' + cnTeam(p.homeTeam) + '</span></div>' +
          '<div class="mc-team"><span class="cn">' + cnTeam(p.awayTeam) + '</span></div></div>' +
          (vp ? '<div class="val-tag">💰 ' + vp.label + ' 差' + (vp.edge > 0 ? '+' : '') + Math.round(vp.edge * 100) + '%</div>' : '') +
          '<div class="mc-pred"><div class="ps">' + p.predictedScore + '</div><div class="pc">' + Math.round((p.confidence || 0) * 100) + '%</div></div>' +
          '</div>';
      }).join('') + '</div>';
  }
  const statsHtml = stats ? '<span class="rec-chip">普通预测方向 ' + Math.round((stats.outcomeRate || 0) * 100) + '%（' + (stats.finished || 0) + '场）</span>' +
    (stats.valueTotal ? '<span class="rec-chip gold">💰价值信号 ' + Math.round((stats.valueRate || 0) * 100) + '%（' + stats.valueTotal + '场）</span>' : '') : '';
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11px;color:var(--text-3)">' +
    '<span class="rec-chip">🧠 ' + (calib.name || 'Elo 模型') + '</span>' +
    '<span class="rec-chip">📅 ' + started + '</span>' +
    '<span class="rec-chip">⚔️ 已结算 ' + (stats?.finished || 0) + ' 场</span>' +
    statsHtml +
    '</div>' + picksHtml;
}

// ===== 赛程赛果 =====
function renderFixtures() {
  const code = FD_CODE[state.league];
  let ms = state.fixtures.filter(m => m.competition?.code === code);
  // 常规模式基准（展示模式分支也使用）
  const t = todayBJ();
  const maxD = fmtDate(new Date(Date.now() + 30 * 86400000).toISOString());
  const now = Date.now();
  // 展示模式：已完赛倒序（最近在前），最多 120 场
  const finished = ms.filter(m => m.status === 'FINISHED');
  if (finished.length >= ms.length * 0.8) {
    ms = finished.sort((a, b) => b.utcDate.localeCompare(a.utcDate)).slice(0, 120);
  } else {
    // 常规模式：今天 + 未来 30 天
    ms = ms.filter(m => {
      const d = fmtDate(m.utcDate);
      if (d < t || d > maxD) return false;
      if (now - new Date(m.utcDate).getTime() > 2.5 * 3600000) return false;
      return true;
    }).sort((a, b) => a.utcDate.localeCompare(b.utcDate));
  }

  // 赛程里没有的（如欧冠未开赛）→ 用预测补充（首词兜底匹配，避免重复显示）
  const hasFix = (h, a) => ms.some(m => {
    const mh = normTeam(m.homeTeam?.name || m.homeTeam?.shortName);
    const ma = normTeam(m.awayTeam?.name || m.awayTeam?.shortName);
    return teamMatch(mh, h) && teamMatch(ma, a);
  });
  const extras = (state.predictions || []).filter(p => p.league === state.league)
    .filter(p => !hasFix(normTeam(p.homeTeam), normTeam(p.awayTeam)))
    .filter(p => { const d = fmtDate(p.kickoff); return d >= t && d <= maxD; })
    .map(p => ({ synthetic: true, homeTeam: { name: p.homeTeam }, awayTeam: { name: p.awayTeam }, utcDate: p.kickoff, competition: { code: p.league }, pred: p }));
  ms = ms.concat(extras).sort((a, b) => a.utcDate.localeCompare(b.utcDate));

  if (!ms.length) return `<div class="empty-state"><div class="icon">📭</div>该联赛暂无未来比赛安排</div>`;

  // 分组（按日期从近到远升序）
  const groups = {};
  ms.forEach(m => { const d = fmtDate(m.utcDate); (groups[d] = groups[d] || []).push(m); });
  const groupOrder = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  return groupOrder.map(d => { const list = groups[d];
    const t2 = todayBJ(), tm = fmtDate(new Date(Date.now() + 86400000).toISOString());
    const cls = d === t2 ? 'is-today' : d === tm ? 'is-tomorrow' : '';
    // 出手建议：有价值信号/异动/高置信预测的优先展示，其余折叠降噪
    const hasSig = m => {
      const p = m.pred || findPrediction(m.homeTeam?.name || m.homeTeam?.shortName, m.awayTeam?.name || m.awayTeam?.shortName);
      if (p && p.valuePicks && p.valuePicks.length) return true;
      if (p && p.oddsChange && ['home','draw','away'].some(k => p.oddsChange[k] != null && Math.abs(p.oddsChange[k]) >= 0.2)) return true;
      if (p && p.confidence != null && p.confidence >= 0.55) return true;
      return false;
    };
    const sig = list.filter(hasSig), rest = list.filter(m => !hasSig(m));
    return `<div class="date-group">
      <div class="date-label ${cls}"><span class="dot"></span>${dateLabel(d)} <span class="count">${list.length} 场</span></div>
      ${sig.length ? `<div class="match-list">${sig.map(renderCard).join('')}</div>` : ''}
      ${rest.length ? `<details class="no-signal"><summary>其他 ${rest.length} 场（无价值信号）</summary><div class="match-list dim">${rest.map(renderCard).join('')}</div></details>` : ''}
    </div>`;
  }).join('');
}

function renderCard(m) {
  const homeName = m.homeTeam?.name || m.homeTeam?.shortName || '?';
  const awayName = m.awayTeam?.name || m.awayTeam?.shortName || '?';
  const pred = m.pred || findPrediction(homeName, awayName);
  const jc = findJingcai(homeName, awayName);
  const score = getScore(m);
  // 异动标红：赔率涨跌 >= 0.2
  let hot = '';
  // 模型价值标记（Elo 与市场差值 >= 10%）
  let value = '';
  if (pred && pred.valuePicks && pred.valuePicks.length) {
    value = '<span class="value-tag">💰 ' + pred.valuePicks.map(v => v.label).join('/') + '</span>';
  }
  if (pred && pred.oddsChange) {
    const oc = pred.oddsChange;
    if (['home','draw','away'].some(k => oc[k] != null && Math.abs(oc[k]) >= 0.2)) hot = '<span class="hot-tag">🔥异动</span>';
  }
  // 赛程难度评级：基于积分榜排名
  let diff = '';
  const st = state.standings?.[m.competition?.code];
  if (st && m.homeTeam?.name) {
    const norm = (s) => (s || '').toLowerCase().replace(/\b(fc|afc|cf|sc)\b/g, '').replace(/[^a-z0-9 ]/g, '').trim();
    const findR = (name) => { const n = norm(name); const r = st.find(x => norm(x.team) === n || norm(x.shortName || '') === n); return r ? r.position : null; };
    const rh = findR(m.homeTeam.name), ra = findR(m.awayTeam.name);
    if (rh && ra) {
      const opp = Math.min(rh, ra);
      if (opp <= 3) diff = '<span class="diff-tag hard">强强</span>';
      else if (opp <= 8) diff = '<span class="diff-tag mid">中上</span>';
      else if (opp >= 15) diff = '<span class="diff-tag easy">悬殊</span>';
    }
  }
  // 模型分歧：Elo vs DC vs 市场方向不一致 → 提示不碰
  let divTag = '';
  if (pred && pred.diverge) divTag = '<span class="diff-tag warn" title="Elo/DC/市场方向不一致">⚠️分歧</span>';
  // 反向信号：模型明显比市场更不看好某方向（负 edge）→ 提示不碰
  let revTag = '';
  if (pred && pred.reversePicks && pred.reversePicks.length) {
    const rp = pred.reversePicks.map(r => r.label + ' 模型' + Math.round(r.modelProb * 100) + '%/盘口' + Math.round(r.oddsProb * 100) + '%').join('、');
    revTag = '<span class="diff-tag warn" title="模型 vs 市场对立（' + rp + '）">⚠️反向</span>';
  }
  // 赛程风险：周中 / 3 天内双赛
  let riskTags = '';
  try {
    const bjDay = new Date(m.utcDate).getUTCDay();
    const isMidweek = [2, 3, 4].includes(bjDay);
    const mk = (n) => normTeam(n);
    const myTeams = [mk(m.homeTeam?.name || ''), mk(m.awayTeam?.name || '')];
    const near = (state.fixtures || []).filter(f => {
      if (!f.homeTeam?.name || !f.awayTeam?.name || !f.utcDate) return false;
      if (f.utcDate === m.utcDate) return false;
      const ft = [mk(f.homeTeam.name), mk(f.awayTeam.name)];
      if (!myTeams.some(x => x && ft.includes(x))) return false;
      const diff = Math.abs(new Date(f.utcDate).getTime() - new Date(m.utcDate).getTime());
      return diff > 0 && diff < 3 * 86400000;
    });
    const tags = [];
    if (isMidweek) tags.push('<span class="diff-tag warn">⚡周中</span>');
    if (near.length) tags.push('<span class="diff-tag warn">⏱️密集赛程</span>');
    riskTags = tags.join('');
  } catch (e) {}
  return `<div class="match-card" onclick="openDetail('${esc(homeName).replace(/'/g, '')}','${esc(awayName).replace(/'/g, '')}','${m.competition?.code || ''}')">
    <div class="mc-time"><div class="t">${score.text === 'VS' ? fmtTime(m.utcDate) : score.text}</div><div class="d">${score.statusText || (m.competition?.code === 'CL' ? '欧冠' : '')}</div></div>
    <div class="mc-teams">

  </div>`;
}

function getScore(m) {
  const { score, status } = m;
  if (status === 'IN_PLAY' || status === 'LIVE' || status === 'PAUSED') {
    const ft = score?.fullTime || {};
    return { text: `${ft.home ?? '-'}-${ft.away ?? '-'}`, cls: 'live', statusText: status === 'PAUSED' ? '暂停' : '● 进行中' };
  }
  if (status === 'FINISHED') {
    const ft = score?.fullTime || {};
    return { text: `${ft.home ?? '-'}-${ft.away ?? '-'}`, cls: '', statusText: '完赛' };
  }
  if (status === 'POSTPONED') return { text: '延期', cls: '', statusText: '延期' };
  return { text: 'VS', cls: '', statusText: '' };
}

function pct(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }
// 迷你折线（赔率走势）：赔率降=资金看好（绿色），升=看淡（橙色）
function trendSpark(values) {
  const vs = (values || []).filter(v => v != null);
  if (vs.length < 2) return '<div style="font-size:10px;color:var(--muted)">采样不足</div>';
  const w = 120, h = 28;
  const min = Math.min(...vs), max = Math.max(...vs);
  const span = (max - min) || 1;
  const pts = vs.map((v, i) => `${((i / (vs.length - 1)) * w).toFixed(1)},${(h - 3 - ((v - min) / span) * (h - 6)).toFixed(1)}`).join(' ');
  const down = vs[vs.length - 1] < vs[0];
  const color = down ? '#22c55e' : '#f59e0b';
  return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.85"/></svg>`;
}
function oddsTrendBlock(p) {
  // 初盘→临场走势：读 odds 文件的 history 快照序列
  const od = (p && p.league) ? state.oddsByLeague[p.league] : null;
  if (!od || !od.history) return '';
  // 后端 odds_fetcher.py 只用 .lower() 生成键，不用 TEAM_ALIAS；前端匹配时保持一致
  const h = normTeam(p.homeTeam), a = normTeam(p.awayTeam);
  const hk = Object.keys(od.history).find(k => { const [x, y] = k.split('|'); return normTeam(x) === h && normTeam(y) === a; });
  if (!hk) return '';
  const snaps = od.history[hk];
  if (!snaps || snaps.length < 1) return '';
  const first = snaps[0], last = snaps[snaps.length - 1];
  const arrow = (x, y) => x != null && y != null ? (y > x ? '<span style="color:#f59e0b">↗' + (y - x).toFixed(2) + '</span>' : y < x ? '<span style="color:#22c55e">↘' + (x - y).toFixed(2) + '</span>' : '<span style="color:var(--muted)">平</span>') : '';
  const box = (k, label) => `<div class="trend-box"><div class="label">${label} ${arrow(first.h2h?.[k], last.h2h?.[k])}</div>${trendSpark(snaps.map(s => s.h2h?.[k]))}</div>`;
  return `<div class="section-title" style="margin-top:10px">📈 盘口走势（初盘→临场，${snaps.length} 次采样）</div>
    <div class="trend-row">${box('home', '主胜')}${box('draw', '平局')}${box('away', '客胜')}</div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px">初盘 ${first.h2h?.home ?? '—'} / ${first.h2h?.draw ?? '—'} / ${first.h2h?.away ?? '—'} → 临场 ${last.h2h?.home ?? '—'} / ${last.h2h?.draw ?? '—'} / ${last.h2h?.away ?? '—'} · 赔率降 = 资金看好</div>`;
}
function switchMkt(mkt) {
  document.querySelectorAll('.mkt-tab').forEach(b => b.classList.toggle('active', b.dataset.mkt === mkt));
  const el = $('mktContent');
  const p = currentPred, jc = currentJc;
  if (mkt === 'h2h') {
    if (!p) { el.innerHTML = '<div class="empty-state">暂无欧赔数据</div>'; return; }
    const pr = p.probabilities || {};
    const ro = p.rawOdds || {};
    const oc = p.oddsChange || {};
    const kl = p.kelly || {};
    // 赔率走势：当前 vs 上次快照
    const trend = (cur, prev) => {
      if (cur == null || prev == null) return '';
      const d = cur - prev;
      if (Math.abs(d) < 0.01) return '<span style="color:var(--muted);font-size:10px">平</span>';
      const cls = d > 0 ? 'var(--red)' : 'var(--green)';
      const arrow = d > 0 ? '↗' : '↘';
      return `<span style="color:${cls};font-size:10px" title="上次快照 ${prev}">${arrow}${d > 0 ? '+' : ''}${d.toFixed(2)}</span>`;
    };
    const chg = (v) => {
      if (v == null) return '';
      const cls = v > 0.01 ? 'up' : (v < -0.01 ? 'down' : '');
      const arrow = v > 0.01 ? '▲' : (v < -0.01 ? '▼' : '');
      const color = v > 0.01 ? '#f59e0b' : (v < -0.01 ? '#22c55e' : '');
      return `<span style="color:${color};font-size:11px;margin-left:4px" title="较上次快照变化">${arrow}${v > 0 ? '+' : ''}${v.toFixed(2)}</span>`;
    };
    const kellyTxt = (v) => v == null ? '' : `<div class="sub" style="color:${v > 0.05 ? '#22c55e' : (v < 0 ? '#ef4444' : '#9ca3af')}">凯利 ${v > 0 ? '+' : ''}${v.toFixed(2)}</div>`;
    el.innerHTML = `<div class="odds-grid">

      <div class="odds-box"><div class="label">主胜 ${trend(ro.home, p.prevOdds?.home)}</div><div class="value">${ro.home ?? '—'}${chg(oc.home)}</div><div class="sub">${pct(pr.home)}</div>${kellyTxt(kl.home)}</div>
      <div class="odds-box"><div class="label">平局 ${trend(ro.draw, p.prevOdds?.draw)}</div><div class="value">${ro.draw ?? '—'}${chg(oc.draw)}</div><div class="sub">${pct(pr.draw)}</div>${kellyTxt(kl.draw)}</div>
      <div class="odds-box"><div class="label">客胜 ${trend(ro.away, p.prevOdds?.away)}</div><div class="value">${ro.away ?? '—'}${chg(oc.away)}</div><div class="sub">${pct(pr.away)}</div>${kellyTxt(kl.away)}</div>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:6px;text-align:center">↗ 较上次快照升（看淡）↘ 降（看好）· 凯利>0 有正期望 · 快照持续累积后将升级为走势曲线</div>
    ${oddsTrendBlock(p)}
    ${p.aiJudge ? (function(a){ const cn = {home:'主胜',draw:'平局',away:'客胜',none:'不碰'}; const conf = a.confidence != null ? Math.round(a.confidence*100) : null; return `<div class="section-title" style="margin-top:10px">🤖 AI 研判<span style="font-size:10px;color:var(--muted);font-weight:400"> ${a.model || ''} · ${a.latency != null ? a.latency + 's' : ''}</span></div><div style="padding:10px 12px;border-radius:8px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.25);font-size:12px;line-height:1.7"><div style="margin-bottom:4px"><b>${a.pick && a.pick !== 'none' ? cn[a.pick] : '无明显倾向'}</b>${a.score ? ' · 比分 ' + a.score : ''}${conf != null ? ' · 置信度 ' + conf + '%' : ''}</div>${a.reason ? '<div style="color:var(--text-2)">' + esc(a.reason) + '</div>' : ''}</div>`;})(p.aiJudge) : ''}
    ${p.eloProb ? `<div class="section-title" style="margin-top:10px">🤖 独立模型 (Elo+修正)</div>
    <div class="odds-grid">
      <div class="odds-box"><div class="label">主胜</div><div class="value">${pct(p.eloProb.home)}</div><div class="sub">盘口 ${pct(pr.home)}</div></div>
      <div class="odds-box"><div class="label">平局</div><div class="value">${pct(p.eloProb.draw)}</div><div class="sub">盘口 ${pct(pr.draw)}</div></div>
      <div class="odds-box"><div class="label">客胜</div><div class="value">${pct(p.eloProb.away)}</div><div class="sub">盘口 ${pct(pr.away)}</div></div>
    </div>
    ${(p.valuePicks || []).length ? `<div style="font-size:11px;padding:8px 10px;border-radius:8px;background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.3);color:var(--gold);margin-top:8px">💰 价值信号：${(p.valuePicks||[]).map(v => v.label + ' 模型' + Math.round(v.modelProb*100) + '% vs 盘口' + Math.round(v.oddsProb*100) + '%').join('、')}</div>` : ''}` : ''}`;
  } else if (mkt === 'jc') {
    if (!jc) { el.innerHTML = '<div class="empty-state">该场比赛未开售竞彩（或不在售）</div>'; return; }
    const had = jc.had || {};
    const hhad = jc.hhad || {};
    const ttg = jc.ttg || {};
    el.innerHTML = `
      ${(function(){ const oh = jc.oddsHistory || []; if (!oh.length) return ''; const first = oh[0], last = oh[oh.length - 1]; const arrow = (a, b) => a && b ? (a === b ? '<span style="color:var(--muted)">平</span>' : (a > b ? '<span style="color:var(--red)">↗' + (a - b).toFixed(2) + '</span>' : '<span style="color:var(--green)">↘' + (b - a).toFixed(2) + '</span>')) : ''; return '<div style="font-size:10px;color:var(--muted);margin-bottom:8px">SP 走势：主胜 ' + (first.h || '—') + arrow(last.h, first.h) + ' · 平 ' + (first.d || '—') + arrow(last.d, first.d) + ' · 客 ' + (first.a || '—') + arrow(last.a, first.a) + '（' + oh.length + ' 次采样）</div>'; })()}
      <div class="section-title" style="margin-top:0">胜平负 SP</div>
      <div class="odds-grid">
        <div class="odds-box"><div class="label">主胜</div><div class="value">${had.h ?? '—'}</div></div>
        <div class="odds-box"><div class="label">平局</div><div class="value">${had.d ?? '—'}</div></div>
        <div class="odds-box"><div class="label">客胜</div><div class="value">${had.a ?? '—'}</div></div>
      </div>
      <div class="section-title">让球胜平负（${jc.hhad?.goalLine ? '让 ' + jc.hhad.goalLine + ' 球' : ''}）</div>
      <div class="odds-grid">
        <div class="odds-box"><div class="label">主胜</div><div class="value">${hhad.h ?? '—'}</div></div>
        <div class="odds-box"><div class="label">平局</div><div class="value">${hhad.d ?? '—'}</div></div>
        <div class="odds-box"><div class="label">客胜</div><div class="value">${hhad.a ?? '—'}</div></div>
      </div>
      <div class="section-title">总进球 SP</div>
      <div class="odds-grid" style="grid-template-columns:repeat(4,1fr)">
        ${[0,1,2,3,4,5,6,7].map(i => `<div class="odds-box"><div class="label">${i === 7 ? '7+' : i + '球'}</div><div class="value" style="font-size:14px">${ttg[i] ?? '—'}</div></div>`).join('')}
      </div>
      ${(function(){ const crs = jc.crsOdds || {}; const entries = Object.entries(crs); if (!entries.length) return ''; const top = entries.sort((a,b) => parseFloat(a[1]) - parseFloat(b[1])).slice(0, 8); return '<div class="section-title">比分玩法 SP（波胆）</div><div class="cs-grid">' + top.map(([s, o]) => '<div class="cs-item"><div class="score">' + s + '</div><div class="p">' + o + '</div></div>').join('') + '</div>'; })()}
      <div class="section-title">半全场 SP</div>
      <div class="odds-grid" style="grid-template-columns:repeat(3,1fr)">
        ${[['胜胜','hh'],['胜平','hd'],['胜负','ha'],['平胜','dh'],['平平','dd'],['平负','da'],['负胜','ah'],['负平','ad'],['负负','aa']].map(([cn, k]) =>
          `<div class="odds-box"><div class="label">${cn}</div><div class="value" style="font-size:13px">${(jc.hafu || {})[cn] ?? '—'}</div></div>`).join('')}
      </div>
      <div class="xg-note">竞彩官方 SP（本地脚本定时抓取）· ${jc.matchNumStr || ''}</div>`;
  } else if (mkt === 'ou') {
    if (!p) { el.innerHTML = '<div class="empty-state">暂无大小球数据</div>'; return; }
    const ou = p.overUnder || {};
    const om = p.ouModel;
    // 模型 vs 盘口对比（模型大球概率 vs 盘口隐含概率）
    const cmp = (label, modelV, mktV, edge, kl) => {
      if (modelV == null) return '';
      const eCls = edge > 0.02 ? 'color:#22c55e' : (edge < -0.02 ? 'color:#ef4444' : 'color:var(--muted)');
      const klTxt = kl == null ? '' : `<div class="sub">凯利 ${kl > 0 ? '+' : ''}${kl.toFixed(2)}</div>`;
      return `<div class="odds-box"><div class="label">${label}</div><div class="value">${pct(modelV)}</div><div class="sub" style="${eCls}">盘口 ${pct(mktV)} · edge${edge > 0 ? '+' : ''}${(edge * 100).toFixed(0)}%</div>${klTxt}</div>`;
    };
    el.innerHTML = `<div class="odds-grid">
      <div class="odds-box"><div class="label">大球 ${ou.line ?? 2.5}</div><div class="value">${pct(ou.over)}</div><div class="sub">${ou.overPrice ? '赔率 ' + ou.overPrice : ''}</div></div>
      <div class="odds-box"><div class="label">小球 ${ou.line ?? 2.5}</div><div class="value">${pct(ou.under)}</div><div class="sub">${ou.underPrice ? '赔率 ' + ou.underPrice : ''}</div></div>
      <div class="odds-box"><div class="label">倾向</div><div class="value" style="font-size:15px">${(ou.over||0) >= 0.5 ? '大球' : '小球'}</div><div class="sub">盘口</div></div>
    </div>
    ${om ? `<div class="section-title" style="margin-top:10px">🤖 模型 vs 盘口（大小球）</div>
    <div class="odds-grid">${cmp('模型大球', om.over, ou.over, om.edge, om.kelly)}<div class="odds-box"><div class="label">解读</div><div class="value" style="font-size:13px">${om.edge > 0.02 ? '模型认为大球有价值' : om.edge < -0.02 ? '模型认为小球有价值' : '模型与盘口一致'}</div><div class="sub">edge${om.edge > 0 ? '+' : ''}${((om.edge || 0) * 100).toFixed(0)}%</div></div></div>
    <div style="font-size:10px;color:var(--muted)">edge = 模型大球概率 − 盘口隐含概率；正=大球方向有正期望</div>` : ''}`;
  } else if (mkt === 'sp') {
    if (!p || !p.spreads) { el.innerHTML = '<div class="empty-state">暂无让球盘数据</div>'; return; }
    const s = p.spreads;
    const sm = p.spModel;
    const eCls = sm && sm.edge != null ? (sm.edge > 0.02 ? 'color:#22c55e' : (sm.edge < -0.02 ? 'color:#ef4444' : 'color:var(--muted)')) : '';
    el.innerHTML = `<div class="odds-grid">
      <div class="odds-box"><div class="label">主队让球</div><div class="value">${s.home?.point ?? '—'}</div><div class="sub">赔率 ${s.home?.price ?? '—'}</div></div>
      <div class="odds-box"><div class="label">客队受让</div><div class="value">${s.away?.point ?? '—'}</div><div class="sub">赔率 ${s.away?.price ?? '—'}</div></div>
      <div class="odds-box"><div class="label">解读</div><div class="value" style="font-size:13px">${s.home?.point < 0 ? '机构看好主队' : '机构看好客队'}</div></div>
    </div>
    ${sm ? `<div class="section-title" style="margin-top:10px">🤖 模型 vs 盘口（让球）</div>
    <div class="odds-grid">
      <div class="odds-box"><div class="label">模型赢盘率</div><div class="value">${pct(sm.cover)}</div><div class="sub" style="${eCls}">盘口隐含 ${pct(sm.implied)} · edge${sm.edge > 0 ? '+' : ''}${((sm.edge || 0) * 100).toFixed(0)}%</div>${sm.kelly != null ? `<div class="sub" style="${sm.kelly > 0 ? 'color:#22c55e' : 'color:#ef4444'}">凯利 ${sm.kelly > 0 ? '+' : ''}${sm.kelly.toFixed(2)}</div>` : ''}</div>
      <div class="odds-box"><div class="label">解读</div><div class="value" style="font-size:13px">${sm.edge > 0.02 ? '模型认为主队赢盘被低估' : sm.edge < -0.02 ? '模型认为主队赢盘被高估' : '模型与盘口一致'}</div><div class="sub">主队让 ${sm.point} 球视角</div></div>
    </div>
    <div style="font-size:10px;color:var(--muted)">edge = 模型赢盘率 − 盘口隐含概率；正=让球方向有正期望</div>` : ''}`;
  } else if (mkt === 'cs') {
    if (!p) { el.innerHTML = '<div class="empty-state">暂无波胆数据</div>'; return; }
    const cs = p.correctScores || [];
    const crs = (jc && jc.crsOdds) || {};
    const hasCrs = Object.keys(crs).length > 0;
    const items = cs.map(c => {
      const price = crs[c.score];
      let val = '';
      if (price) {
        const implied = 1 / parseFloat(price);
        const edge = c.prob - implied;
        val = `<div class="sub" style="${edge > 0.02 ? 'color:#22c55e;font-weight:700' : 'color:var(--muted)'}">竞彩 ${price}${edge > 0.02 ? ' · 💰价值' : ''}</div>`;
      }
      return `<div class="cs-item"><div class="score">${c.score}</div><div class="p">${pct(c.prob)}</div>${val}</div>`;
    }).join('');
    el.innerHTML = `<div class="cs-grid">${items}</div>` +
      (hasCrs ? '<div style="font-size:10px;color:var(--muted);margin-top:6px">模型比分概率 vs 竞彩波胆赔率隐含概率：模型概率更高 = 该比分有价值（开赛后自动出现）</div>' : '<div style="font-size:10px;color:var(--muted);margin-top:6px">竞彩波胆未开售该场比赛，无法对比价值</div>');
  }
}

// ── 刷新（合并：右上角一键 = 本地重载 + 云端触发 + 自动轮询）──
// 详情页原「刷新分析」已移除：云端刷新状态统一显示在右上角刷新按钮旁。
function refreshAll() {
  const status = $('refreshStatus');
  const pat = localStorage.getItem('gh_pat');
  // ① 有 Token 则触发云端 Actions 重抓（不等待本地加载）
  if (pat) {
    fetch('https://api.github.com/repos/BarryLiu-agent/football-guide/actions/workflows/daily.yml/dispatches', {
      method: 'POST',
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + pat, 'X-GitHub-Api-Version': '2022-11-28' },
      body: JSON.stringify({ ref: 'main' })
    }).then(r => {
      if (r.ok) status.textContent = '云端刷新已触发，约 2-4 分钟自动更新…';
      else if (r.status === 401 || r.status === 403) {
        localStorage.removeItem('gh_pat');
        status.innerHTML = 'Token 无效，已清除 · <a href="#" onclick="event.preventDefault();configToken()" style="color:var(--gold)">重新配置</a>';
      } else status.textContent = '触发失败（HTTP ' + r.status + '），30 分钟内自动更新。';
    }).catch(() => status.textContent = '网络错误，30 分钟内自动更新。');
    startPoll();
  }
  // ② 立即重载现有数据并渲染（本地 / GitHub Pages 都是重新拉取 data/*.json）
  loadAll().then(() => {
    render();
    lastGen = (state.predictionsMeta || {}).generatedAt || null;
    if (currentPred) syncDetail();
    if (!pat) {
      status.innerHTML = '已刷新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + ' · <a href="#" onclick="event.preventDefault();configToken()" style="color:var(--gold)">配置云端 Token</a>';
    } else {
      status.textContent = '已刷新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '（云端刷新中）';
    }
  });
}

function configToken() {
  const status = $('refreshStatus');
  status.innerHTML = '需 GitHub Token：<a href="https://github.com/settings/tokens/new?type=classic&description=kun-refresh&scopes=workflow" target="_blank" style="color:var(--gold)">点此创建</a> 后粘贴：';
  const input = document.createElement('input');
  input.type = 'password'; input.placeholder = 'ghp_...';
  input.style.cssText = 'width:150px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--text);font-size:11px;';
  const btn = document.createElement('button');
  btn.textContent = '保存'; btn.className = 'btn'; btn.style.cssText = 'padding:4px 10px;font-size:11px;';
  btn.onclick = () => { const v = input.value.trim(); if (!v) return; localStorage.setItem('gh_pat', v); refreshAll(); };
  status.appendChild(input); status.appendChild(btn);
}

function startPoll() {
  // 轮询检测云端预测数据是否更新，更新后自动重载并同步详情；5 分钟无变化自动停止
  if (pollTimer) clearInterval(pollTimer);
  const start = Date.now();
  pollTimer = setInterval(async () => {
    try {
      const d = await loadJson('data/predictions.json');
      if (lastGen && d.generatedAt !== lastGen) {
        clearInterval(pollTimer); pollTimer = null;
        $('refreshStatus').textContent = '✅ 云端数据已更新';
        loadAll().then(() => { render(); if (currentPred) syncDetail(); });
      } else if (!lastGen) {
        lastGen = d.generatedAt;
      } else if (Date.now() - start > 5 * 60000) {
        clearInterval(pollTimer); pollTimer = null;
        $('refreshStatus').textContent = '云端刷新完成（数据未变化）';
      }
    } catch (e) {}
  }, 20000);
}

function syncDetail() {
  // 详情弹窗打开时同步最新分析文本
  const fresh = state.predictions.find(p => p.homeTeam === currentPred.homeTeam && p.awayTeam === currentPred.awayTeam && p.league === currentPred.league);
  if (fresh) { currentPred = fresh; $('analysisBox').textContent = fresh.analysis || ''; }
}

// ===== Init =====
loadAll().then(render);
</script>
