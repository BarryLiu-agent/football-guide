<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足球观看指南</title>
<style>
/* ===== Design System ===== */
:root {
  --color-bg: #f7f8fa;
  --color-surface: #ffffff;
  --color-border: #e8eaef;
  --color-primary: #1a5632;
  --color-primary-light: #2d8a4e;
  --color-accent: #f0b90b;
  --color-text: #1a1a2e;
  --color-text-secondary: #5f6b7a;
  --color-live: #dc2626;
  --color-finished: #6b7280;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ===== Header ===== */
.header {
  background: var(--color-primary);
  color: #fff;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(26,86,50,0.25);
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-refresh {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  width: 32px; height: 32px; border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  transition: background 0.2s;
}
.btn-refresh:hover { background: rgba(255,255,255,0.25); }
.btn-refresh:active { transform: scale(0.92); }
.last-updated { font-size: 0.72rem; opacity: 0.8; }

/* ===== Tabs ===== */
.tab-nav {
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  position: sticky; top: 56px; z-index: 99;
  display: flex; gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; min-width: fit-content;
  padding: 12px 20px;
  border: none; background: none;
  font-size: 0.9rem; font-weight: 600;
  color: var(--color-text-secondary);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  font-family: inherit;
}
.tab-btn.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}
.tab-btn:hover { color: var(--color-primary); }

/* ===== Main Content ===== */
.main {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== League Filter ===== */
.league-filter {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.league-chip {
  padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--color-border);
  background: var(--color-surface); font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
  color: var(--color-text-secondary);
}
.league-chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.league-chip:hover:not(.active) { border-color: var(--color-primary); }

/* ===== Date Group ===== */
.date-group { margin-bottom: 24px; }
.date-label {
  font-size: 0.85rem; font-weight: 700; color: var(--color-text-secondary);
  padding: 8px 0 10px 0; text-transform: uppercase; letter-spacing: 0.03em;
  border-bottom: 1px solid var(--color-border); margin-bottom: 10px;
}

/* ===== Match Card ===== */
.match-card {
  background: var(--color-surface); border-radius: var(--radius-md);
  padding: 14px 16px; margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
  display: flex; align-items: center; gap: 12px;
  transition: box-shadow 0.2s; cursor: default;
  border-left: 3px solid transparent;
}
.match-card.star-match { border-left-color: var(--color-accent); }
.match-card:hover { box-shadow: var(--shadow-md); }
.match-card.clickable { cursor: pointer; }
.match-card.clickable:hover { border-left-color: var(--color-primary); }
.match-league {
  font-size: 0.7rem; font-weight: 700; color: var(--color-text-secondary);
  text-transform: uppercase; letter-spacing: 0.04em; min-width: 32px;
}
.match-time {
  font-size: 0.78rem; color: var(--color-text-secondary);
  min-width: 48px; text-align: center; line-height: 1.3;
}
.match-teams { flex: 1; min-width: 0; }
.match-teams .team-row {
  display: flex; align-items: center; gap: 8px; padding: 3px 0;
  font-size: 0.9rem; font-weight: 500;
}
.match-teams .team-row img {
  width: 20px; height: 20px; object-fit: contain; flex-shrink: 0;
}
.match-score {
  font-size: 1.1rem; font-weight: 700; min-width: 56px; text-align: center;
  letter-spacing: 0.04em;
}
.match-score.live { color: var(--color-live); }
.match-score.scheduled { color: var(--color-text-secondary); font-size: 0.85rem; }
.match-score.finished { color: var(--color-finished); }
.match-status {
  display: inline-block; font-size: 0.65rem; font-weight: 700;
  padding: 2px 6px; border-radius: 4px; margin-top: 2px;
}
.status-live { background: #fef2f2; color: var(--color-live); }
.status-paused { background: #f3f4f6; color: #92400e; }
.status-finished { background: #f3f4f6; color: var(--color-finished); }
.status-scheduled { background: #f0fdf4; color: var(--color-primary); }

/* ===== History page ===== */
.date-picker-bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-bottom: 16px;
}
.date-picker-bar input[type="date"] {
  padding: 8px 12px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 0.9rem;
}
.btn {
  padding: 8px 16px; border: none; border-radius: var(--radius-sm);
  background: var(--color-primary); color: #fff; font-weight: 600;
  font-size: 0.85rem; cursor: pointer; font-family: inherit;
  transition: background 0.2s;
}
.btn:hover { background: var(--color-primary-light); }
.btn-secondary {
  background: var(--color-surface); color: var(--color-text);
  border: 1.5px solid var(--color-border);
}
.btn-secondary:hover { background: var(--color-bg); }

/* ===== Stars page ===== */

/* ===== Empty & Error states ===== */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--color-text-secondary);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state h3 { font-size: 1rem; margin-bottom: 4px; }
.empty-state p { font-size: 0.85rem; }
.error-banner {
  background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
  border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 16px;
  font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
}
.error-banner .retry-btn {
  margin-left: auto; background: #991b1b; color: #fff; border: none;
  padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
  font-family: inherit;
}
.loading-spinner {
  display: flex; justify-content: center; padding: 32px;
}
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--color-border);
  border-top-color: var(--color-primary); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .header h1 { font-size: 1rem; }
  .match-card { padding: 10px 12px; gap: 8px; }
  .match-teams .team-row { font-size: 0.82rem; }
  .match-score { font-size: 0.95rem; min-width: 44px; }
  .league-filter { gap: 4px; }
  .league-chip { padding: 5px 10px; font-size: 0.73rem; }
}
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  * { transition: none !important; }
}

/* ===== Detail Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.45);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--color-bg); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto;
  padding: 18px 16px 24px;
  animation: slideUp 0.25s ease;
}
@media (min-width: 768px) {
  .modal-overlay { align-items: center; }
  .modal { border-radius: var(--radius-lg); max-height: 80vh; }
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.modal-title { font-size: 1rem; font-weight: 700; }
.modal-close {
  background: none; border: none; font-size: 1.3rem; cursor: pointer;
  color: var(--color-text-secondary); padding: 4px 8px;
}
.mkt-tabs { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
.mkt-tab {
  padding: 6px 14px; border-radius: 18px; border: 1.5px solid var(--color-border);
  background: var(--color-surface); font-size: 0.8rem; font-weight: 600;
  cursor: pointer; color: var(--color-text-secondary); font-family: inherit;
}
.mkt-tab.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.odds-box {
  background: var(--color-surface); border-radius: var(--radius-md);
  padding: 10px; text-align: center; box-shadow: var(--shadow-sm);
}
.odds-box .label { font-size: 0.68rem; color: var(--color-text-secondary); }
.odds-box .value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
.odds-box .prob { font-size: 0.7rem; color: var(--color-primary-light); }
.cs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.cs-item {
  background: var(--color-surface); border-radius: var(--radius-sm);
  padding: 8px; text-align: center; box-shadow: var(--shadow-sm); font-size: 0.85rem;
}
.cs-item .score { font-weight: 700; }
.cs-item .p { font-size: 0.7rem; color: var(--color-primary-light); }
.analysis-box {
  background: var(--color-surface); border-radius: var(--radius-md);
  padding: 12px 14px; box-shadow: var(--shadow-sm);
  font-size: 0.85rem; line-height: 1.7; white-space: pre-line;
}
.analysis-actions { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
.refresh-note { font-size: 0.7rem; color: var(--color-text-secondary); }
.refreshing { opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <h1>⚽ 足球观看指南</h1>
    <div class="header-actions">
      <span class="last-updated" id="lastUpdated"></span>

    </div>
  </div>
</header>

<!-- Tab Navigation -->
<nav class="tab-nav">
  <button class="tab-btn active" data-tab="today">📅 比赛</button>
  <button class="tab-btn" data-tab="history">📋 历史记录</button>
</nav>

<!-- Main Content -->
<main class="main">

  </section>

  <!-- History Tab -->

      <input type="date" id="historyDate" />
      <button class="btn" onclick="loadHistory()">查询</button>
      <button class="btn btn-secondary" onclick="loadYesterday()">昨天</button>
      <button class="btn btn-secondary" onclick="loadLastWeek()">上周</button>
      <button class="btn btn-secondary" onclick="loadLastMonth()">上月</button>
    </div>
    <div id="historyMatches"></div>
  </section>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="mkt-tabs">
      <button class="mkt-tab active" data-mkt="1x2" onclick="switchMkt('1x2')">胜负 1X2</button>
      <button class="mkt-tab" data-mkt="ou" onclick="switchMkt('ou')">大小球</button>
      <button class="mkt-tab" data-mkt="cs" onclick="switchMkt('cs')">波胆</button>
    </div>
    <div id="mktContent"></div>
    <h3 style="font-size:0.85rem;color:var(--color-text-secondary);margin:6px 0 8px;">📝 分析</h3>
    <div class="analysis-actions">
      <button class="btn" id="refreshBtn" onclick="refreshAnalysis()">🔄 刷新分析</button>
      <span class="refresh-note" id="refreshNote"></span>
    </div>
    <div class="analysis-box" id="analysisBox"></div>
  </div>
</div>

function displayTeam(name) {
  const cn = TEAM_NAMES[name] || name;
  if (cn !== name) return `${cn} (${name})`;
  return name;
}

// ===== State =====
let allMatches = [];
let activeLeagueFilter = 'all';
let isLoading = false;

// ===== Data Loading (from local JSON files) =====
let fixturesData = null;

function getDateRange() {
  // Always use all data from fixtures.json; no need to compute date range
  return null;
}

async function loadFixtures() {
  try {
    const resp = await fetch('data/fixtures.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    fixturesData = await resp.json();
    return { matches: fixturesData.matches || [], errors: fixturesData.errors || [] };
  } catch (e) {
    console.warn('Failed to load fixtures.json:', e);
    return { matches: [], errors: [{ code: 'ALL', name: '全部' }] };
  }
}

async function fetchAllMatches(dateFrom, dateTo) {
  // Load from local JSON file (pre-generated by GitHub Actions)
  if (!fixturesData) {
    return await loadFixtures();
  }
  return { matches: fixturesData.matches || [], errors: fixturesData.errors || [] };
}

// Fetch specific date for history - filter local data
async function fetchHistoryDate(dateStr) {
  if (!fixturesData) {
    const result = await loadFixtures();
    fixturesData = { matches: result.matches, errors: result.errors };
  }
  const matches = (fixturesData.matches || []).filter(m => formatDate(m.utcDate) === dateStr);
  return { matches, errors: fixturesData.errors || [] };
}

// ===== Data Processing =====
function groupByDate(matches) {
  const groups = {};
  matches.forEach(m => {
    const date = formatDate(m.utcDate);
    if (!groups[date]) groups[date] = [];
    groups[date].push(m);
  });
  // Sort by date
  return Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0]));
}

function formatDate(utcStr) {
  const d = new Date(utcStr);
  // Convert to Beijing time (UTC+8)
  const bj = new Date(d.getTime() + 8 * 3600000);
  const y = bj.getFullYear();
  const mo = String(bj.getMonth() + 1).padStart(2, '0');
  const day = String(bj.getDate()).padStart(2, '0');
  return `${y}-${mo}-${day}`;
}

function formatTime(utcStr) {
  const d = new Date(utcStr);
  const bj = new Date(d.getTime() + 8 * 3600000);
  return `${String(bj.getHours()).padStart(2, '0')}:${String(bj.getMinutes()).padStart(2, '0')}`;
}

function getDateLabel(dateStr) {
  const today = formatDate(new Date().toISOString());
  const tomorrow = formatDate(new Date(Date.now() + 86400000).toISOString());
  if (dateStr === today) return '今天';
  if (dateStr === tomorrow) return '明天';
  // Friendly weekday
  const d = new Date(dateStr);
  const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const md = `${d.getMonth() + 1}月${d.getDate()}日`;
  return `${md} ${days[d.getDay()]}`;
}

function getScoreDisplay(match) {
  const { score, status } = match;
  const isLive = status === 'IN_PLAY' || status === 'LIVE' || status === 'PAUSED';
  const isFinished = status === 'FINISHED';

  if (isLive) {
    const ft = score?.fullTime || {};
    const cls = status === 'PAUSED' ? 'live' : 'live';
    return { text: `${ft.home ?? '-'} - ${ft.away ?? '-'}`, cls, statusText: status === 'PAUSED' ? '暂停' : '进行中' };
  }
  if (isFinished) {
    const ft = score?.fullTime || {};
    return { text: `${ft.home ?? '-'} - ${ft.away ?? '-'}`, cls: 'finished', statusText: '完赛' };
  }
  if (status === 'POSTPONED') return { text: '延期', cls: 'scheduled', statusText: '延期' };
  if (status === 'CANCELLED') return { text: '取消', cls: 'scheduled', statusText: '取消' };
  return { text: formatTime(match.utcDate), cls: 'scheduled', statusText: match.matchday ? `第${match.matchday}轮` : '' };
}

// ===== 预测匹配（比赛页 ↔ 预测数据） =====
function normTeam(s) {
  return (s || '').toLowerCase().replace(/\bfc\b/g, '').replace(/[^a-z0-9 ]/g, '').trim();
}

function findPrediction(home, away) {
  const h = normTeam(home), a = normTeam(away);
  if (!h || !a) return null;
  return lastPreds.find(p =>
    (normTeam(p.homeTeam) === h && normTeam(p.awayTeam) === a) ||
    (normTeam(p.homeTeam).split(' ')[0] === h.split(' ')[0] && normTeam(p.awayTeam).split(' ')[0] === a.split(' ')[0])
  ) || null;
}

// ===== Render =====
function renderLeagueFilter(containerId, active, onChange) {
  const el = document.getElementById(containerId);
  el.innerHTML = `
    <button class="league-chip ${active === 'all' ? 'active' : ''}" data-league="all">全部</button>
    ${Object.entries(COMPETITIONS).map(([k, v]) =>
      `<button class="league-chip ${active === k ? 'active' : ''}" data-league="${k}">${v}</button>`
    ).join('')}
  `;
  el.querySelectorAll('.league-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.league-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      onChange(btn.dataset.league);
    });
  });
}

function renderMatchCard(match) {
  const score = getScoreDisplay(match);
  const league = COMPETITIONS[match.competition?.code] || match.competition?.code || '';
  const isLive = match.status === 'IN_PLAY' || match.status === 'LIVE' || match.status === 'PAUSED';
  const isFinished = match.status === 'FINISHED';
  const homeName = match.homeTeam?.name || match.homeTeam?.shortName || '?';
  const awayName = match.awayTeam?.name || match.awayTeam?.shortName || '?';
  const pred = findPrediction(homeName, awayName);
  const predBadge = pred
    ? `<div style="min-width:56px;text-align:center;padding:4px 8px;border-radius:8px;background:#f0fdf4;border:1px solid #bbf7d0;font-size:0.78rem;">
         <div style="font-weight:700;color:var(--color-primary)">预测 ${pred.predictedScore}</div>
         <div style="font-size:0.65rem;color:var(--color-text-secondary)">${Math.round((pred.confidence || 0) * 100)}%</div>
       </div>`
    : '';

  return `
    <div class="match-card ${pred ? 'star-match' : ''} clickable" data-id="${match.id}" onclick="openDetailByTeams('${homeName.replace(/'/g, '')}', '${awayName.replace(/'/g, '')}')">
      <div class="match-league">${league}</div>
      <div class="match-teams">
        <div class="team-row">
          <img src="${match.homeTeam?.crest || ''}" alt="" onerror="this.style.display='none'" loading="lazy">
          <span>${displayTeam(homeName)}</span>
        </div>
        <div class="team-row">
          <img src="${match.awayTeam?.crest || ''}" alt="" onerror="this.style.display='none'" loading="lazy">
          <span>${displayTeam(awayName)}</span>
        </div>
      </div>
      <div class="match-score ${score.cls}">
        ${score.text}
        ${score.statusText ? `<div class="match-status status-${score.cls}">${score.statusText}</div>` : ''}
      </div>
      ${predBadge}
    </div>
  `;
}

function renderMatchList(containerId, matches, emptyMsg) {
  const el = document.getElementById(containerId);
  if (!matches.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><h3>暂无比赛</h3><p>${emptyMsg || '该时段没有比赛安排'}</p></div>`;
    return;
  }
  const groups = groupByDate(matches);
  el.innerHTML = groups.map(([date, ms]) => `
    <div class="date-group">
      <div class="date-label">${getDateLabel(date)} · ${date}</div>
      ${ms.map(m => renderMatchCard(m)).join('')}
    </div>
  `).join('');
}

async function loadToday() {
  const el = document.getElementById('todayMatches');
  el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

  if (!allMatches.length || (Date.now() - lastFetchTime > 60000)) {
    await refreshData(true);
  }
  // 预加载预测数据（供卡片徽章与详情）
  if (!predictionsLoaded) await loadPredictionsData();

  const today = formatDate(new Date().toISOString());
  const maxDate = formatDate(new Date(Date.now() + 30 * 86400000).toISOString());

  let filtered = allMatches.filter(m => {
    const d = formatDate(m.utcDate);
    return d >= today && d <= maxDate;
  });

  if (activeLeagueFilter !== 'all') {
    filtered = filtered.filter(m => m.competition?.code === activeLeagueFilter);
  }

  renderMatchList('todayMatches', filtered, '未来一个月暂无比赛安排');
}

function loadHistory() {
  const dateStr = document.getElementById('historyDate').value;
  if (!dateStr) return;
  showHistoryForDate(dateStr);
}

async function showHistoryForDate(dateStr) {
  const el = document.getElementById('historyMatches');
  el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

  // Check if we already have data for this date in cache
  let filtered = allMatches.filter(m => formatDate(m.utcDate) === dateStr);

  if (!filtered.length) {
    // Fetch from API
    const { matches } = await fetchHistoryDate(dateStr);
    filtered = matches;
    // Merge into allMatches cache
    matches.forEach(m => {
      if (!allMatches.find(ex => ex.id === m.id)) allMatches.push(m);
    });
  }
  renderMatchList('historyMatches', filtered, `${dateStr} 没有比赛记录`);
}

function loadYesterday() {
  const d = formatDate(new Date(Date.now() - 86400000).toISOString());
  document.getElementById('historyDate').value = d;
  showHistoryForDate(d);
}
function loadLastWeek() {
  const d = formatDate(new Date(Date.now() - 7 * 86400000).toISOString());
  document.getElementById('historyDate').value = d;
  showHistoryForDate(d);
}
function loadLastMonth() {
  const d = formatDate(new Date(Date.now() - 30 * 86400000).toISOString());
  document.getElementById('historyDate').value = d;
  showHistoryForDate(d);
}

// ===== Refresh & Fetch =====
let lastFetchTime = 0;

async function refreshData(silent = false) {
  const refreshBtn = document.querySelector('.btn-refresh');
  if (!silent) refreshBtn.style.animation = 'spin 0.6s linear';

  try {
    const { matches, errors } = await loadFixtures();
    allMatches = matches;
    lastFetchTime = Date.now();

    // Update timestamp from fixtures data if available, else use local time
    const genTime = fixturesData?.generatedAt;
    if (genTime) {
      const d = new Date(genTime);
      document.getElementById('lastUpdated').textContent =
        `更新于 ${d.toLocaleDateString('zh-CN')} ${d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
    } else {
      document.getElementById('lastUpdated').textContent =
        `更新于 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
    }

    if (errors.length && !silent) {
      console.warn('部分数据加载失败:', errors);
    }
  } catch (e) {
    if (!silent) {
      document.getElementById('todayMatches').innerHTML =
        `<div class="error-banner">
          ⚠️ 数据加载失败,请确保 data/fixtures.json 文件存在
          <button class="retry-btn" onclick="refreshData()">重试</button>
        </div>`;
    }
  } finally {
    refreshBtn.style.animation = '';
  }

  // Re-render current tab
  const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
  if (activeTab === 'today') loadToday();
}

// ===== Predictions Data =====
let lastPreds = [];
let predictionsLoaded = false;

async function loadPredictionsData() {
  try {
    const resp = await fetch('data/predictions.json?t=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    lastPreds = (data.predictions || []).slice().sort((a, b) => b.confidence - a.confidence);
    predictionsLoaded = true;
  } catch (e) {
    console.warn('预测数据加载失败:', e);
    lastPreds = [];
  }
}

// ===== Detail Modal =====
let currentPred = null;
let pollTimer = null;
let lastGeneratedAt = null;

function openDetailByTeams(homeName, awayName) {
  loadPredictionsData().then(() => {
    const pred = findPrediction(homeName, awayName);
    if (pred) {
      currentPred = pred;
      document.getElementById('modalTitle').textContent =
        `${displayTeam(pred.homeTeam)} vs ${displayTeam(pred.awayTeam)}`;
      document.getElementById('analysisBox').textContent = pred.analysis || '暂无分析';
    } else {
      currentPred = null;
      document.getElementById('modalTitle').textContent =
        `${displayTeam(homeName)} vs ${displayTeam(awayName)}`;
      document.getElementById('analysisBox').textContent = '该场比赛暂无赔率与预测数据（可能未开售赔率或数据源未覆盖）。';
    }
    document.getElementById('detailModal').classList.add('open');
    document.getElementById('refreshNote').textContent = '';
    switchMkt('1x2');
    lastGeneratedAt = null;
  });
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('open');
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function switchMkt(mkt) {
  document.querySelectorAll('.mkt-tab').forEach(b => b.classList.toggle('active', b.dataset.mkt === mkt));
  const el = document.getElementById('mktContent');
  const p = currentPred;
  if (!p) {
    el.innerHTML = '<div class="empty-state" style="padding:24px"><p>暂无赔率数据</p></div>';
    return;
  }
  const probs = p.probabilities || {};
  const pct = v => v == null ? '—' : `${Math.round(v * 100)}%`;

  if (mkt === '1x2') {
    const h = probs.home, d = probs.draw, a = probs.away;
    el.innerHTML = `
      <div class="odds-grid">
        <div class="odds-box"><div class="label">主胜</div><div class="value">${pct(h)}</div><div class="prob">隐含概率</div></div>
        <div class="odds-box"><div class="label">平局</div><div class="value">${pct(d)}</div><div class="prob">隐含概率</div></div>
        <div class="odds-box"><div class="label">客胜</div><div class="value">${pct(a)}</div><div class="prob">隐含概率</div></div>
      </div>`;
  } else if (mkt === 'ou') {
    const ou = p.overUnder || {};
    el.innerHTML = `
      <div class="odds-grid">
        <div class="odds-box"><div class="label">大球 Over ${ou.line ?? 2.5}</div><div class="value">${pct(ou.over)}</div><div class="prob">概率</div></div>
        <div class="odds-box"><div class="label">小球 Under ${ou.line ?? 2.5}</div><div class="value">${pct(ou.under)}</div><div class="prob">概率</div></div>
        <div class="odds-box"><div class="label">倾向</div><div class="value" style="font-size:0.95rem">${(ou.over || 0) >= 0.5 ? '大球' : '小球'}</div><div class="prob">泊松模型</div></div>
      </div>`;
  } else if (mkt === 'cs') {
    const cs = p.correctScores || [];
    el.innerHTML = `<div class="cs-grid">${cs.map(c =>
      `<div class="cs-item"><div class="score">${c.score}</div><div class="p">${pct(c.prob)}</div></div>`
    ).join('')}</div>`;
  }
}

function refreshAnalysis() {
  const btn = document.getElementById('refreshBtn');
  const note = document.getElementById('refreshNote');

  // 已有 PAT 则直接触发；否则引导输入
  const pat = localStorage.getItem('gh_pat');
  if (pat) {
    triggerDispatch(pat, note, btn);
  } else {
    note.innerHTML = '要自动刷新需 GitHub Token（仅存本浏览器，不公开）。' +
      '<a href="https://github.com/settings/tokens/new?type=classic&description=kun-refresh&scopes=workflow" target="_blank" style="color:var(--color-primary);text-decoration:underline">点此创建（勾选 workflow 权限）</a>' +
      '，然后粘贴：';
    const input = document.createElement('input');
    input.type = 'password';
    input.placeholder = 'ghp_... 或 github_pat_...';
    input.style.cssText = 'width:180px;padding:6px 10px;border:1.5px solid var(--color-border);border-radius:6px;font-size:0.75rem;';
    const saveBtn = document.createElement('button');
    saveBtn.textContent = '保存并刷新';
    saveBtn.className = 'btn';
    saveBtn.style.cssText = 'padding:6px 12px;font-size:0.75rem;';
    saveBtn.onclick = () => {
      const v = input.value.trim();
      if (!v) return;
      localStorage.setItem('gh_pat', v);
      note.innerHTML = '';
      triggerDispatch(v, note, btn);
    };
    note.appendChild(input);
    note.appendChild(saveBtn);
  }

  // 轮询 predictions.json，检测 generatedAt 变化后自动刷新
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const resp = await fetch('data/predictions.json?t=' + Date.now());
      const data = await resp.json();
      if (lastGeneratedAt && data.generatedAt !== lastGeneratedAt) {
        note.textContent = '✅ 分析已更新（' + new Date(data.generatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) + '）';
        clearInterval(pollTimer); pollTimer = null;
        btn.classList.remove('refreshing');
        if (currentPred) {
          // 找到对应比赛的最新预测并刷新
          const fresh = (data.predictions || []).find(p => p.homeTeam === currentPred.homeTeam && p.awayTeam === currentPred.awayTeam);
          if (fresh) { currentPred = fresh; switchMkt(document.querySelector('.mkt-tab.active').dataset.mkt); document.getElementById('analysisBox').textContent = fresh.analysis || '暂无分析'; }
        }
      } else if (!lastGeneratedAt) {
        lastGeneratedAt = data.generatedAt;
      }
    } catch (e) { /* 轮询失败忽略 */ }
  }, 20000);
}

function triggerDispatch(pat, note, btn) {
  btn.classList.add('refreshing');
  note.textContent = '正在触发后台刷新：重新抓取消息与赔率…';
  fetch('https://api.github.com/repos/BarryLiu-agent/football-guide/actions/workflows/daily.yml/dispatches', {
    method: 'POST',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + pat,
      'X-GitHub-Api-Version': '2022-11-28'
    },
    body: JSON.stringify({ ref: 'main' })
  }).then(r => {
    if (r.ok) {
      note.textContent = '✅ 已触发！Actions 正在重新抓取消息/赔率并生成分析，约 2-4 分钟后自动更新…';
    } else if (r.status === 401 || r.status === 403) {
      localStorage.removeItem('gh_pat');
      note.textContent = 'Token 无效或已过期，已清除。请点击刷新重新输入 Token。';
    } else {
      note.textContent = '触发失败（HTTP ' + r.status + '）。页面仍会自动检测更新（每30分钟自动运行）。';
    }
  }).catch(() => {
    note.textContent = '网络错误，无法触发。页面仍会自动检测更新（每30分钟自动运行）。';
  });
}

// ===== Tab Switching =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');

    if (btn.dataset.tab === 'today') loadToday();
    else if (btn.dataset.tab === 'history') {
      document.getElementById('historyDate').value = formatDate(new Date(Date.now() - 86400000).toISOString());
      showHistoryForDate(document.getElementById('historyDate').value);
    }
  });
});

// ===== League Filter Setup =====
renderLeagueFilter('leagueFilter', activeLeagueFilter, (league) => {
  activeLeagueFilter = league;
  loadToday();
});

// ===== Init =====
function init() {
  document.getElementById('historyDate').value = formatDate(new Date(Date.now() - 86400000).toISOString());
  loadToday();
  // Auto-refresh every 60s
  setInterval(() => {
    const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
    if (activeTab === 'today') refreshData(true).then(() => loadToday());
    else refreshData(true);
  }, 60000);
}

init();
</script>
